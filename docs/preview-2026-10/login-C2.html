<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录 · 方案 C2 先选身份升级版</title>
<link rel="stylesheet" href="assets/preview.css">
<style>
  body{background:linear-gradient(180deg,#eef1f6 0%,var(--paper) 46%,#f2ede1 100%);min-height:100vh}
  .stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 0}
  .lhead{text-align:center;margin-bottom:34px}
  .lhead img{width:74px;height:74px;margin:0 auto 16px}
  .lhead h1{font-family:var(--serif);font-size:31px;letter-spacing:8px;color:var(--blue-ink);font-weight:700}
  .lhead .en{font-size:10px;letter-spacing:3.5px;color:var(--ink-3);margin-top:9px}
  .lhead .mrule{width:58px;height:2px;background:var(--gold);margin:16px auto 0;position:relative}
  .lhead .mrule::after{content:"";position:absolute;right:-11px;top:-3px;width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
  /* 步骤指示 */
  .steps{display:flex;align-items:center;gap:14px;margin-bottom:26px;font-size:12px;letter-spacing:2px;color:var(--ink-3)}
  .steps .st{display:flex;align-items:center;gap:8px}
  .steps .no{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:Georgia,serif;font-size:12px;color:var(--ink-3);background:#fff}
  .steps .st.on .no{background:var(--blue);border-color:var(--blue);color:#fff}
  .steps .st.on{color:var(--blue-ink)}
  .steps .ln{width:52px;height:1px;background:var(--line)}
  /* 身份卡 */
  .roles{display:grid;grid-template-columns:302px 302px;gap:26px;margin-bottom:30px}
  .role{background:#fff;border:1px solid var(--line);border-radius:5px;padding:30px 28px 26px;cursor:pointer;
    text-align:center;position:relative;transition:all .25s;overflow:hidden}
  .role::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:transparent;transition:background .25s}
  .role:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(43,58,94,.10)}
  .role.on{border-color:var(--gold);box-shadow:0 14px 34px rgba(168,137,90,.20)}
  .role.on::before{background:var(--gold)}
  .role.on::after{content:"✓ 已选择";position:absolute;top:12px;right:12px;font-size:10.5px;letter-spacing:1px;
    color:var(--gold-deep);border:1px solid var(--gold);border-radius:2px;padding:2px 8px;background:#fdfaf4}
  .role .ric{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;
    background:rgba(74,92,140,.08);color:var(--blue);transition:all .25s}
  .role.on .ric{background:var(--blue);color:#fff}
  .role svg{width:26px;height:26px}
  .role b{font-family:var(--serif);font-size:18px;letter-spacing:5px;color:var(--blue-ink);display:block}
  .role span{display:block;font-size:11.5px;letter-spacing:2px;color:var(--ink-3);margin-top:9px}
  /* 表单（横向三件套） */
  .formzone{width:630px;display:grid;grid-template-columns:1fr 1fr 148px;gap:14px;align-items:end}
  .fld label{display:block;font-size:12px;color:var(--ink-2);letter-spacing:2px;margin-bottom:7px;text-align:left}
  .fld input{width:100%;border:1px solid var(--line);border-radius:3px;padding:12px 14px;font-size:14.5px;font-family:var(--sans);color:var(--ink);background:#fff;transition:all .25s}
  .fld input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,92,140,.10)}
  .btn-login{border:none;border-radius:3px;background:linear-gradient(120deg,#e8cd94,#c8a45f 55%,#e3c88f);color:#251b09;
    font-family:var(--serif);font-size:15.5px;letter-spacing:3px;padding:12.5px 0;cursor:pointer;font-weight:600;transition:all .25s;height:46px}
  .btn-login:hover{opacity:.9;transform:translateY(-1px)}
  .foot{margin-top:36px;font-size:11.5px;letter-spacing:2.5px;color:var(--ink-3)}
</style>
</head>
<body>
<div class="stage">

  <div class="lhead au">
    <img src="assets/seal-boyi.png" alt="博艺教育校徽">
    <h1>砺蕴教务系统</h1>
    <div class="en">ERUDITART EDUCATION · ACADEMIC ADMINISTRATION</div>
    <div class="mrule"></div>
  </div>

  <div class="steps au d1">
    <div class="st on"><span class="no">1</span><span>选择身份</span></div>
    <div class="ln"></div>
    <div class="st on"><span class="no">2</span><span>输入账号登录</span></div>
  </div>

  <div class="roles au d1" id="roles">
    <div class="role" data-tip="请输入工号或手机号" data-name="教职工">
      <div class="ric"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="5.4" r="2.6"/><path d="M2.8 13.6c.7-2.6 2.7-4 5.2-4s4.5 1.4 5.2 4"/><path d="M11.4 3.2l1.2 1.2M12 2l1.8 1.8-1.4 1.4"/></svg></div>
      <b>我是教职工</b><span>教务 · 教师 · 管理端</span>
    </div>
    <div class="role on" data-tip="请输入学号或手机号" data-name="学生">
      <div class="ric"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 2.4L14 5.4 8 8.4 2 5.4z"/><path d="M4.2 6.6v3.2c0 1.3 1.7 2.4 3.8 2.4s3.8-1.1 3.8-2.4V6.6"/></svg></div>
      <b>我是学生</b><span>课表 · 打卡 · 作业</span>
    </div>
  </div>

  <div class="formzone au d2">
    <div class="fld"><label>账 号</label><input id="acc" placeholder="请输入学号或手机号"></div>
    <div class="fld"><label>密 码</label><input type="password" placeholder="请输入密码"></div>
    <button class="btn-login" id="goBtn">学生 登 录</button>
  </div>

  <div class="foot au d3">博艺教育 · 博学宏才 艺德卓绝 · 砺蕴教务系统 © 2026</div>

</div>
<script>
  document.querySelectorAll('#roles .role').forEach(r=>{
    r.addEventListener('click',()=>{
      document.querySelectorAll('#roles .role').forEach(x=>x.classList.remove('on'));
      r.classList.add('on');
      document.getElementById('acc').placeholder = r.dataset.tip;
      document.getElementById('goBtn').textContent = r.dataset.name + ' 登 录';
    });
  });
</script>
</body>
</html>
