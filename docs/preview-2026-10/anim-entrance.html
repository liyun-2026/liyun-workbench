<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>入场动画演示 · 无文字版</title>
<style>
  @font-face{font-family:'LiYunXingShu';src:url('../../assets/liyun-xingshu.woff2') format('woff2')}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#3a3f4d;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:"PingFang SC",sans-serif}
  .stage{position:relative;width:min(760px,92vw);aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#f7f6f2}
  .glow{position:absolute;left:50%;top:50%;width:52%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(201,171,124,.30),rgba(201,171,124,0) 68%);opacity:0}
  .seal{position:absolute;left:50%;top:50%;width:14%;transform:translate(-50%,-50%);
    filter:drop-shadow(0 10px 24px rgba(120,90,40,.30));opacity:0}
  .pulse{position:absolute;left:50%;top:50%;width:14%;aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;border:2px solid #c9ab7c;opacity:0}
  .play .seal{animation:s-stamp .6s cubic-bezier(.2,.9,.3,1.18) .15s both}
  .play .pulse.p1{animation:s-pulse 1s ease-out .32s both}
  .play .pulse.p2{animation:s-pulse 1s ease-out .62s both}
  .play .glow{animation:s-glow 1.4s ease-out .1s both}
  .play.done{animation:s-out .5s ease-in 2.15s both}
  @keyframes s-stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(1.9) rotate(-8deg)}62%{opacity:1;transform:translate(-50%,-50%) scale(.96) rotate(1deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes s-pulse{0%{opacity:.6;transform:translate(-50%,-50%) scale(.8)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.15)}}
  @keyframes s-glow{0%{opacity:0}45%{opacity:1}100%{opacity:.85}}
  @keyframes s-out{to{opacity:0}}
  .ctl{display:flex;gap:12px}
  button{background:#c9ab7c;border:0;color:#2b3446;font-size:13px;padding:8px 22px;border-radius:8px;cursor:pointer;font-weight:500}
  button:hover{background:#d9bd91}
  .tip{color:#9aa3b5;font-size:12px}
</style>
</head>
<body>
  <div class="stage" id="st">
    <div class="glow"></div>
    <span class="pulse p1"></span>
    <span class="pulse p2"></span>
    <img class="seal" src="../../assets/seal-boyi.png" alt="">
  </div>
  <div class="ctl"><button onclick="play()">重播</button></div>
  <div class="tip">总长约 2.6 秒（落章 → 双圈金晕 → 停 → 整体淡出进入工作台），自动循环播放</div>
<script>
  const st = document.getElementById('st');
  function play(){
    st.classList.remove('play','done');
    void st.offsetWidth;               // 强制重排，动画从头走
    st.classList.add('play');
    clearTimeout(window.__t1); clearTimeout(window.__t2);
    window.__t1 = setTimeout(()=>st.classList.add('done'), 2150);
    window.__t2 = setTimeout(play, 3000);   // 循环
  }
  play();
</script>
</body>
</html>
