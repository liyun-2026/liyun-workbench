<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录 · 方案 A2 影像分栏升级版</title>
<link rel="stylesheet" href="assets/preview.css">
<style>
  .wrap{display:grid;grid-template-columns:1.15fr 1fr;min-height:100vh}
  /* 左：品牌影像面板（升级：细金内框 + 学期章 + 弹性动效） */
  .lpanel{position:relative;overflow:hidden;background:#1d2942;display:flex;flex-direction:column;justify-content:space-between;padding:58px 64px}
  .lpanel .bgimg{position:absolute;inset:0;background:url(assets/banner-studio.png) center 42%/cover no-repeat;opacity:.44;transform:scale(1.04);transition:transform 8s ease}
  .lpanel:hover .bgimg{transform:scale(1.09)}
  .lpanel .veil{position:absolute;inset:0;background:linear-gradient(160deg,rgba(29,41,66,.90) 0%,rgba(29,41,66,.52) 45%,rgba(29,41,66,.88) 100%)}
  .lpanel .frame{position:absolute;inset:22px;border:1px solid rgba(201,171,124,.38);pointer-events:none}
  .lpanel .frame::before{content:"";position:absolute;top:-1px;left:-1px;width:34px;height:34px;border-top:2px solid var(--gold);border-left:2px solid var(--gold)}
  .lpanel .frame::after{content:"";position:absolute;bottom:-1px;right:-1px;width:34px;height:34px;border-bottom:2px solid var(--gold);border-right:2px solid var(--gold)}
  .lpanel>*{position:relative;z-index:2}
  .lbrand{display:flex;align-items:center;gap:18px}
  .lbrand img{width:66px;height:66px}
  .lbrand b{font-family:var(--serif);font-size:30px;letter-spacing:7px;color:#f3efe6;display:block}
  .lbrand small{font-size:10px;letter-spacing:3.5px;color:#93a3c4;display:block;margin-top:6px}
  .lmid .motto{font-family:var(--serif);font-size:46px;letter-spacing:11px;color:#f3efe6;line-height:1.3;text-shadow:0 2px 24px rgba(10,16,30,.45)}
  .lmid .motto span{color:var(--gold)}
  .lmid .mrule{width:76px;height:2px;background:var(--gold);margin:28px 0 22px;position:relative}
  .lmid .mrule::after{content:"";position:absolute;right:-13px;top:-3px;width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
  .lmid .msub{font-family:var(--serif);font-size:16px;letter-spacing:5px;color:#e8cd94}
  .lfoot{display:flex;justify-content:space-between;align-items:flex-end}
  .lfoot .term{font-size:11.5px;letter-spacing:2px;color:#8fa0c0}
  .lfoot .seal2{border:1px solid rgba(201,171,124,.45);color:#e8cd94;font-family:var(--serif);font-size:12px;letter-spacing:4px;padding:7px 14px 7px 18px}
  /* 右：登录表单（升级：带图标输入框 + 金下划线角色切换） */
  .rpanel{background:#fff;display:flex;align-items:center;justify-content:center}
  .fbox{width:408px}
  .fbox h1{font-family:var(--serif);font-size:28px;letter-spacing:5px;color:var(--blue-ink);font-weight:700}
  .fbox .fen{font-size:10px;letter-spacing:3px;color:var(--ink-3);margin-top:8px}
  .frule{height:1px;background:var(--line);position:relative;margin:20px 0 30px}
  .frule::before{content:"";position:absolute;left:0;top:-1px;height:3px;width:56px;background:var(--blue)}
  .frule::after{content:"";position:absolute;left:60px;top:-3px;width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
  .roletoggle{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin-bottom:28px}
  .roletoggle button{border:none;background:none;font-family:var(--serif);font-size:16px;letter-spacing:5px;color:var(--ink-3);padding:12px 0 14px;cursor:pointer;position:relative;transition:color .2s}
  .roletoggle button::after{content:"";position:absolute;left:26%;right:26%;bottom:-1px;height:3px;background:transparent;transition:background .2s}
  .roletoggle button.on{color:var(--blue-ink)}
  .roletoggle button.on::after{background:var(--gold)}
  .fld{position:relative;margin-bottom:20px}
  .fld label{display:block;font-size:12px;color:var(--ink-2);letter-spacing:2px;margin-bottom:8px}
  .fld .ic{position:absolute;left:13px;bottom:12px;width:17px;height:17px;color:var(--ink-3);pointer-events:none}
  .fld input{width:100%;border:1px solid var(--line);border-radius:3px;padding:12px 14px 12px 40px;font-size:14.5px;font-family:var(--sans);color:var(--ink);background:#fcfcfa;transition:all .25s}
  .fld input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(74,92,140,.10)}
  .frow{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-3);margin:2px 0 26px}
  .frow a{color:var(--gold-deep)}
  .btn-login{width:100%;border:none;border-radius:3px;background:linear-gradient(120deg,#50618f,var(--blue));color:#fff;font-family:var(--serif);font-size:17px;letter-spacing:8px;text-indent:8px;padding:14px 0;cursor:pointer;transition:all .25s;box-shadow:0 10px 24px rgba(43,58,94,.24)}
  .btn-login:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 14px 30px rgba(43,58,94,.30)}
  .fnote{margin-top:26px;font-size:11.5px;letter-spacing:2px;color:var(--ink-3);text-align:center}
</style>
</head>
<body>
<div class="wrap">

  <div class="lpanel au">
    <div class="bgimg"></div><div class="veil"></div><div class="frame"></div>
    <div class="lbrand">
      <img src="assets/seal-boyi.png" alt="博艺教育校徽">
      <div><b>砺蕴教务系统</b><small>ERUDITART EDUCATION · ACADEMIC ADMINISTRATION</small></div>
    </div>
    <div class="lmid">
      <div class="motto">博学宏才 <span>·</span> 艺德卓绝</div>
      <div class="mrule"></div>
      <div class="msub">南阳博艺教育 · 专注播音艺考 22 年</div>
    </div>
    <div class="lfoot">
      <span class="term">2026—2027 学年 · 秋季学期 · 第 9 教学周</span>
      <span class="seal2">博 艺</span>
    </div>
  </div>

  <div class="rpanel">
    <div class="fbox au d2">
      <h1>欢迎登录</h1>
      <div class="fen">WELCOME · SIGN IN</div>
      <div class="frule"></div>
      <div class="roletoggle" id="roles">
        <button class="on" data-tip="请输入工号或手机号">教职工</button>
        <button data-tip="请输入学号或手机号">学生</button>
      </div>
      <div class="fld">
        <label>账 号</label>
        <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="5.4" r="2.6"/><path d="M2.8 13.6c.7-2.6 2.7-4 5.2-4s4.5 1.4 5.2 4"/></svg>
        <input id="acc" placeholder="请输入工号或手机号">
      </div>
      <div class="fld">
        <label>密 码</label>
        <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3.2" y="7" width="9.6" height="6.4" rx="1.2"/><path d="M5.4 7V5.2a2.6 2.6 0 015.2 0V7"/></svg>
        <input type="password" placeholder="请输入密码">
      </div>
      <div class="frow"><span><input type="checkbox" checked style="vertical-align:-2px"> 记住账号</span><a href="#">忘记密码</a></div>
      <button class="btn-login">登 录</button>
      <div class="fnote">博艺教育 · 砺蕴教务系统 © 2026</div>
    </div>
  </div>

</div>
<script>
  document.querySelectorAll('#roles button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('#roles button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      document.getElementById('acc').placeholder = b.dataset.tip;
    });
  });
</script>
</body>
</html>
