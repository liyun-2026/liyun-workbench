<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>打卡 · 学生端（样张）</title>
<link rel="stylesheet" href="assets/mobile.css">
<style>
  /* ---- 学生打卡页（生产 page-stuSign 逻辑还原）----
     同心圆大盘四态：未打卡 / 已打卡 / 迟到 / 不用打卡
     样张画默认「未打卡」态，秒数 live 跳动 */
  .ck-hero{
    background:linear-gradient(160deg,#50618f,var(--blue));
    color:#fff;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 34px;
  }
  .ck-top{
    display:flex;
    justify-content:flex-end;
    gap:8px;
  }
  .ck-ent{
    display:inline-flex;
    align-items:center;
    gap:5px;
    height:26px;
    padding:0 11px;
    border-radius:13px;
    background:rgba(255,255,255,.14);
    font-size:11px;
    color:rgba(255,255,255,.9);
  }
  .ck-hero h1{
    font-family:var(--serif);
    font-size:22px;
    font-weight:600;
    letter-spacing:4px;
    margin-top:10px;
  }
  .ck-hero .sub{
    font-size:12px;
    color:rgba(255,255,255,.72);
    margin-top:4px;
  }

  /* ---- 同心圆大盘：外圈细环 → 主盘 → 内圈白环 ---- */
  .dial-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:30px 0 6px;
  }
  .dial{
    width:238px;
    height:238px;
    border-radius:50%;
    border:1px solid rgba(74,92,140,.28);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .disc{
    width:206px;
    height:206px;
    border-radius:50%;
    background:linear-gradient(165deg,#50618f,var(--blue-deep));
    box-shadow:0 12px 28px rgba(56,74,116,.35);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .iring{
    width:168px;
    height:168px;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,.35);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:7px;
    color:#fff;
  }
  .iring .word{
    font-family:var(--serif);
    font-size:25px;
    font-weight:600;
    letter-spacing:7px;
    text-indent:7px;
    line-height:1.2;
  }
  .iring .time{
    font-family:Georgia,var(--serif);
    font-size:17px;
    color:rgba(255,255,255,.88);
    letter-spacing:1.5px;
  }
  /* 未打卡时秒数 live：服务端时间，冒号闪动示意 */
  @keyframes ckblink{0%,55%{opacity:1}56%,100%{opacity:.15}}
  .iring .blink{animation:ckblink 1s steps(1) infinite}
  .status-line{
    margin-top:16px;
    font-size:11px;
    color:var(--ink-3);
    letter-spacing:.5px;
    text-align:center;
  }

  /* ---- 断网补传提示（黄底细条） ---- */
  .offline{
    display:flex;
    gap:9px;
    align-items:flex-start;
    background:rgba(201,171,124,.14);
    border:1px solid rgba(201,171,124,.42);
    border-radius:10px;
    padding:10px 12px;
    margin-top:22px;
    font-size:12px;
    line-height:1.6;
    color:#8a6d3f;
  }
  .offline svg{flex:none;margin-top:2px}

  /* ---- 打卡记录 ---- */
  .rec{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 0;
  }
  .rec + .rec{border-top:1px solid var(--line)}
  .rec .rd{
    flex:none;
    font-size:12px;
    color:var(--ink-2);
  }
  .rec .rt{
    flex:none;
    font-family:Georgia,var(--serif);
    font-size:16px;
    color:var(--ink);
  }
  .rec .way{
    margin-left:auto;
    font-size:11px;
    color:var(--ink-3);
  }

  /* ---- 请假入口卡 ---- */
  .leave{
    display:flex;
    align-items:center;
    gap:12px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:13px 14px;
  }
  .leave .lic{
    flex:none;
    width:40px;
    height:40px;
    border-radius:50%;
    background:rgba(74,92,140,.08);
    color:var(--blue);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .leave .lt{font-size:15px;font-weight:600;color:var(--ink)}
  .leave .ld{font-size:12px;color:var(--ink-2);margin-top:2px}
  .leave .lv{
    flex:none;
    margin-left:auto;
    height:30px;
    padding:0 14px;
    border-radius:15px;
    border:1px solid var(--blue);
    color:var(--blue);
    font-size:12px;
    display:flex;
    align-items:center;
  }
</style>
</head>
<body>

  <!-- 学生端整页水印（生产逻辑：仅学生端有） -->
  <div class="wm"></div>

  <!-- 深蓝沉浸头 -->
  <div class="ck-hero">
    <div class="ck-top">
      <span class="ck-ent">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M7 12h10"/></svg>
        扫码打卡
      </span>
      <span class="ck-ent">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H20M17 12v3M20 12v2.2"/></svg>
        密钥
      </span>
    </div>
    <h1>打卡</h1>
    <div class="sub">2026 年 10 月 20 日 星期二 · 打卡窗口 08:00–20:30</div>
  </div>

  <!-- 白板叠头 -->
  <div class="sheet">

    <!-- 同心圆大盘 · 默认未打卡态 -->
    <div class="dial-wrap">
      <div class="dial">
        <div class="disc">
          <div class="iring">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.2-6.5-10a6.5 6.5 0 0113 0c0 4.8-6.5 10-6.5 10z"/><circle cx="12" cy="10.5" r="2.2"/></svg>
            <div class="word">打卡</div>
            <div class="time">19:23<span class="blink">:</span>47</div>
          </div>
        </div>
      </div>
      <div class="status-line">进入打卡窗口 · 点击圆盘即打卡（服务端时间）</div>
    </div>

    <!-- 断网补传提示 -->
    <div class="offline">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a7 7 0 017 7M12 5a7 7 0 00-7 7M12 8.5a3.5 3.5 0 013.5 3.5M12 8.5A3.5 3.5 0 008.5 12M12 12v.01"/><path d="M4 20L20 4" stroke-width="1.4"/></svg>
      <span>有 1 次打卡没传上去（断网时记的），联网后自动提交，按当时时间算迟到。</span>
    </div>

    <!-- 打卡记录 -->
    <div class="sec"><h2>打卡记录</h2><span class="more">近 7 天</span></div>
    <div class="card" style="padding:2px 14px">
      <div class="rec">
        <span class="rd">10月20日</span><span class="rt">19:02</span>
        <span class="pill blue">已打卡</span>
        <span class="way">定位</span>
      </div>
      <div class="rec">
        <span class="rd">10月19日</span><span class="rt">19:47</span>
        <span class="pill red">迟到</span>
        <span class="way">定位</span>
      </div>
      <div class="rec">
        <span class="rd">10月18日</span><span class="rt">19:05</span>
        <span class="pill blue">已打卡</span>
        <span class="way">扫码</span>
      </div>
      <div class="rec">
        <span class="rd">10月17日</span><span class="rt">--:--</span>
        <span class="pill gold">待核</span>
        <span class="way">断网补传</span>
      </div>
    </div>

    <!-- 请假入口卡 -->
    <div class="sec"><h2>请假</h2><span class="more">本学期已请假 3 次</span></div>
    <div class="leave">
      <span class="lic">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h4"/></svg>
      </span>
      <div>
        <div class="lt">我的请假</div>
        <div class="ld">需请假当天提前提交，家长可代为申请</div>
      </div>
      <span class="lv">申请请假</span>
    </div>

  </div>

  <!-- 底部 5-Tab（学生端 · 打卡 active） -->
  <nav class="tabbar">
    <a href="m-home-student.html">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></svg></span>
      今日
    </a>
    <a class="on" href="m-checkin.html">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.2-6.5-10a6.5 6.5 0 0113 0c0 4.8-6.5 10-6.5 10z"/><circle cx="12" cy="10.5" r="2.2"/></svg></span>
      打卡
    </a>
    <a href="m-homework.html">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h6"/></svg></span>
      作业
    </a>
    <a href="m-table.html">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></span>
      课表
    </a>
    <a href="m-me.html">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.8 3.6-6.5 8-6.5s8 2.7 8 6.5"/></svg></span>

    </a>
  </nav>

</body>
</html>
