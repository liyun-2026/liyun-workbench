<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>服务中心（样张）</title>
<link rel="stylesheet" href="assets/mobile.css">
<style>
  .svc-foot{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:26px 0 8px;
    color:var(--ink-3);
  }
  .svc-foot img{width:20px;height:20px;opacity:.8}
  .svc-foot span{font-size:11px;letter-spacing:1px}
</style>
</head>
<body>

  <!-- 头部 -->
  <div class="svc-head">
    <h1>服务中心</h1>
    <div class="sub">功能全在这，按类别找</div>
    <div class="search-pill gray" style="margin-top:16px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      搜索功能名称
    </div>
    <div class="chips">
      <span class="chip on">常用</span>
      <span class="chip">教务</span>
      <span class="chip">学习</span>
      <span class="chip">校园</span>
    </div>
  </div>

  <!-- 白板叠头 -->
  <div class="sheet">

    <div class="sec"><h2>常用</h2></div>
    <div class="grid5">
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2.5h6v3H9z"/><path d="M8.5 11l2 2 4-4.5"/><path d="M9 16.5h6"/></svg></span><span class="lb">考勤</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h6"/></svg></span><span class="lb">作业</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></span><span class="lb">课表</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M21 20H3"/></svg></span><span class="lb">量化</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.2-6.5-10a6.5 6.5 0 0113 0c0 4.8-6.5 10-6.5 10z"/><circle cx="12" cy="10.5" r="2.2"/></svg></span><span class="lb">打卡管理</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4l11 4V6L4 10z"/><path d="M15 8.5c2.5 0 4 1.5 4 3.5s-1.5 3.5-4 3.5"/><path d="M6.5 14.5l1 4.5h2.5l-.8-4"/></svg></span><span class="lb">限时征集</span></a>
    </div>

    <div class="sec"><h2>教务</h2></div>
    <div class="grid5">
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2.5h6v3H9z"/><path d="M9.5 14.5h1.8v1.8H9.5zM13 12h1.8v4.3H13"/></svg></span><span class="lb">模考</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3.5v4c0 4.2-3 7.4-7 8.5-4-1.1-7-4.3-7-8.5v-4L12 3z"/><path d="M9 11.8l2.2 2.2 4-4.5"/></svg></span><span class="lb">晚自习</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg></span><span class="lb">课时统计</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="12" cy="10" r="2.5"/><path d="M7.5 17.5c.6-2.2 2.4-3.5 4.5-3.5s3.9 1.3 4.5 3.5"/></svg></span><span class="lb">学员档案</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c0-3 2.4-5 5.5-5s5.5 2 5.5 5"/><circle cx="16.5" cy="9.5" r="2.5"/><path d="M16 14.5c2.6 0 4.5 1.7 4.5 4"/></svg></span><span class="lb">名册</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="4"/><path d="M5 21c0-3.8 3.2-6.5 7-6.5"/><path d="M16.5 13l5.5 5.5-1.2 1.2L15.3 14"/></svg></span><span class="lb">学生账号</span></a>
    </div>

    <div class="sec"><h2>校园</h2></div>
    <div class="grid5">
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v12H4z"/><path d="M4 9h16M9 13h6"/></svg></span><span class="lb">协作</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M21 20H3"/></svg></span><span class="lb">量化细则</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v10H9l-4 3.5V6z"/><path d="M8 10h8M8 13h5"/></svg></span><span class="lb">上报与申请</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></span><span class="lb">巡检</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.6M12 17.9v2.6M3.5 12h2.6M17.9 12h2.6M6 6l1.8 1.8M16.2 16.2L18 18M18 6l-1.8 1.8M7.8 16.2L6 18"/></svg></span><span class="lb">设置</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 15L21 9l-6-6"/><path d="M21 9h-9a7 7 0 000 14h2"/></svg></span><span class="lb">服务中心说明</span></a>
    </div>

    <div class="svc-foot">
      <img src="assets/mark-liyun-gold.png" alt="砺蕴">
      <span>博学宏才 · 艺德卓绝</span>
    </div>

  </div>

</body>
</html>
