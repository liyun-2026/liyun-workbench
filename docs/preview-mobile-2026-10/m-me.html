<link rel="stylesheet" href="assets/mobile.css">
<style>
  .me-hero{
    position:relative;
    background:linear-gradient(160deg,#50618f,var(--blue));
    color:#fff;
    padding:calc(env(safe-area-inset-top) + 54px) 20px 46px;
    display:flex;
    align-items:center;
    gap:14px;
    overflow:hidden;
  }
  /* 浮雕背景（定案）：砺蕴 logo 虚化，只占头部右下角，不占全部 */
  .bg-logo{
    position:absolute;
    right:-8px;
    bottom:-14px;
    width:180px;
    transform:rotate(-8deg);
    opacity:.32;
    pointer-events:none;
  }
  .avatar{
    flex:none;width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(255,255,255,.35);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:22px;
  }
  .me-info{flex:1}
  .me-info .nm{font-size:17px;font-weight:600}
  .me-info .cl{font-size:12px;color:rgba(255,255,255,.72);margin-top:3px}
  .qr{flex:none;align-self:flex-end;color:rgba(255,255,255,.85)}
  .rv{
    flex:none;
    font-family:Georgia,var(--serif);
    font-size:13px;
    letter-spacing:.5px;
    color:var(--ink-3);
  }
</style>
