<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录 · 砺蕴教务系统（样张）</title>
<link rel="stylesheet" href="assets/mobile.css">
<style>
  /* ---- 登录页 v3：上部翻动轮播 + 学术仪式感 ---- */
  body{background:var(--blue-ink)}

  /* 上部 45vh 影像轮播区 */
  .lg-hero{
    position:relative;
    height:45vh;
    min-height:320px;
  }
  /* 横向 scroll-snap 轨道：touch 可滑 */
  .lg-track{
    display:flex;
    height:100%;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
  }
  .lg-track::-webkit-scrollbar{display:none}
  .lg-slide{
    position:relative;
    flex:0 0 100%;
    height:100%;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    overflow:hidden;
  }
  /* 屏内文字：固定于影像区下部 1/3 */
  .lg-slide .cap{
    position:absolute;
    left:20px;right:20px;bottom:44px;
    text-align:center;
    z-index:1;
  }
  .cap .ct{
    font-family:var(--serif);
    font-size:16px;
    letter-spacing:4px;
    text-indent:4px;
    color:#fff;
    text-shadow:0 1px 10px rgba(0,0,0,.35);
  }
  .cap .cs{
    font-size:10px;
    letter-spacing:2px;
    color:rgba(255,255,255,.72);
    margin-top:7px;
    text-shadow:0 1px 6px rgba(0,0,0,.3);
  }
  /* 浅底屏：深字 */
  .lg-slide.lite .cap .ct{color:var(--blue-ink);text-shadow:none}
  .lg-slide.lite .cap .cs{color:var(--ink-2);text-shadow:none}

  /* 屏 1：实拍满铺 + 底部渐晕 */
  .s1{background:url("assets/banner-studio.jpg") center/cover no-repeat}
  .s1::before{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(180deg,
      rgba(24,33,56,.42) 0%,
      rgba(24,33,56,.14) 40%,
      rgba(43,58,94,.58) 76%,
      rgba(43,58,94,.9) 100%);
  }

  /* 屏 2：深蓝渐变 + 金线纹样 */
  .s2{background:linear-gradient(175deg,var(--blue-ink),var(--blue-deep))}
  .s2 svg.bgpat{
    position:absolute;inset:0;
    width:100%;height:100%;
  }

  /* 屏 3：浅纸底 + 三张手机拍立得 */
  .s3{background:linear-gradient(180deg,#faf9f5,#efece3)}
  .pols{
    position:absolute;
    left:0;right:0;top:14%;
    z-index:1;
  }
  .pol{
    position:absolute;
    width:104px;
    background:#fff;
    padding:5px 5px 4px;
    box-shadow:0 8px 18px rgba(43,58,94,.2);
    border-radius:2px;
  }
  .pol img{width:94px;height:78px;object-fit:cover}
  .pol span{
    display:block;
    text-align:center;
    font-size:9px;
    letter-spacing:1px;
    color:var(--ink-2);
    padding:5px 0 2px;
  }
  .pol.p1{left:22px;top:26px;transform:rotate(-4deg)}
  .pol.p2{left:50%;margin-left:-52px;top:0;transform:rotate(2.5deg);z-index:2}
  .pol.p3{right:22px;top:34px;transform:rotate(4deg)}

  /* 屏 4：暖纸渐变 + 校园剪影 */
  .s4{background:linear-gradient(180deg,#f3ecdd,#e8dcbd)}
  .s4 svg.bgpat{
    position:absolute;left:0;right:0;bottom:26%;
    width:100%;height:56%;
  }
  .s4 .cap .ct{color:var(--blue-ink)}
  .s4 .cap .cs{color:#8a6f45}

  /* 左上品牌行：绝对定位在轮播外层，不随滚动 */
  .lg-brand{
    position:absolute;
    top:calc(env(safe-area-inset-top) + 14px);
    left:14px;
    z-index:4;
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 13px 6px 7px;
    border-radius:999px;
    background:rgba(24,33,56,.36);
    border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .lg-brand img{width:27px;height:27px}
  .lg-brand .bt{
    font-family:var(--serif);
    font-size:14px;
    font-weight:600;
    color:#fff;
    letter-spacing:2.5px;
  }

  /* 底部圆点指示器：当前屏金点 */
  .lg-dots{
    position:absolute;
    left:0;right:0;bottom:13px;
    z-index:3;
    display:flex;
    justify-content:center;
    gap:6px;
  }
  .lg-dots i{
    width:6px;height:6px;
    border-radius:3px;
    background:rgba(255,255,255,.55);
    box-shadow:0 0 0 1px rgba(43,58,94,.22);
    transition:all .25s ease;
  }
  .lg-dots i.on{
    width:15px;
    background:var(--gold);
    box-shadow:none;
  }

  /* 下部白色圆角大板 */
  .lg-board{
    position:relative;
    z-index:2;
    background:#fff;
    border-radius:20px 20px 0 0;
    margin-top:-28px;
    padding:26px 26px 0;
    min-height:calc(55vh + 28px);
    display:flex;
    flex-direction:column;
    box-shadow:0 -10px 28px rgba(24,33,56,.12);
  }
  .lg-board h1{
    font-family:var(--serif);
    font-size:26px;
    font-weight:600;
    color:var(--blue-ink);
    letter-spacing:2px;
  }
  .wb-rule{
    width:28px;
    height:3px;
    background:var(--gold);
    border-radius:2px;
    margin:12px 0 20px;
  }

  /* 角色胶囊：等宽两枚 */
  .lg-roles{
    display:flex;
    gap:12px;
  }
  .lg-role{
    flex:1 1 0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    height:48px;
    border:1px solid var(--line);
    border-radius:24px;
    background:#fff;
    color:var(--ink-2);
    position:relative;
  }
  .lg-role .rt{
    font-size:15px;
    font-weight:600;
    letter-spacing:1px;
  }
  .lg-role.sel{
    border:1.5px solid var(--blue);
    color:var(--blue);
    background:rgba(74,92,140,.04);
  }
  /* 选中态：底部 2px 金线（替代金点角标，更沉稳） */
  .lg-role.sel::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:7px;
    transform:translateX(-50%);
    width:26px;
    height:2px;
    border-radius:1px;
    background:var(--gold);
  }

  /* 输入框：统一 52px，聚焦描边与图标同步变蓝 */
  .lg-field{
    display:flex;
    align-items:center;
    gap:10px;
    height:52px;
    margin-top:20px;
    padding:0 16px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--paper);
    color:var(--ink-2);
  }
  .lg-field:focus-within{
    border-color:var(--blue);
    background:#fff;
    color:var(--blue);
  }
  .lg-field input{
    flex:1;
    border:0;
    outline:0;
    background:none;
    font-size:16px;
    font-family:inherit;
    color:var(--ink);
    letter-spacing:.5px;
  }
  .lg-field input::placeholder{color:var(--ink-2);letter-spacing:1px}

  /* 登录按钮：深蓝实底 + 明显按压态 */
  .lg-btn{
    width:100%;
    height:50px;
    margin-top:32px;
    border-radius:12px;
    background:var(--blue-deep);
    color:#fff;
    font-family:var(--serif);
    font-size:17px;
    font-weight:600;
    letter-spacing:.3em;
    text-indent:.3em;
    box-shadow:0 6px 16px rgba(56,74,116,.28);
    transition:transform .08s ease,box-shadow .08s ease,filter .08s ease;
  }
  .lg-btn:active{
    transform:translateY(2px) scale(.97);
    filter:brightness(1.18);
    box-shadow:0 1px 4px rgba(56,74,116,.22);
  }

  /* 记住账号 */
  .lg-rem{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    margin-top:20px;
    font-size:12px;
    color:var(--ink-2);
  }
  .lg-rem .box{
    width:15px;height:15px;
    border:1.2px solid var(--ink-3);
    border-radius:4px;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    color:var(--blue);
  }

  /* 底部标语：吸底 */
  .lg-foot{
    margin-top:auto;
    padding:24px 0 calc(18px + env(safe-area-inset-bottom));
    text-align:center;
  }
  .lg-foot .slogan{
    font-family:var(--serif);
    font-size:12px;
    color:rgba(168,137,90,.72);
    letter-spacing:6px;
    text-indent:6px;
  }
  .lg-foot .copy{
    font-size:10px;
    color:var(--ink-2);
    letter-spacing:1.5px;
    margin-top:5px;
  }
</style>
</head>
<body>

  <!-- 上部 45vh 影像轮播区 -->
  <div class="lg-hero">
    <!-- 品牌行：轮播外层绝对定位，不随滑动 -->
    <div class="lg-brand">
      <img src="assets/seal-boyi.png" alt="播字金印">
      <span class="bt">砺蕴教务</span>
    </div>

    <div class="lg-track" id="lgTrack">
      <!-- 屏 1 · 实拍：演播厅 -->
      <div class="lg-slide s1">
        <div class="cap">
          <div class="ct">博学宏才 · 艺德卓绝</div>
          <div class="cs">南阳博艺教育 · 专注播音艺考 22 年</div>
        </div>
      </div>

      <!-- 屏 2 · 深蓝 + 金线纹样 -->
      <div class="lg-slide s2">
        <svg class="bgpat" viewBox="0 0 390 340" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#c9ab7c" stroke-linecap="round" stroke-linejoin="round">
          <!-- 双线细框 -->
          <rect x="13" y="13" width="364" height="314" stroke-width="1" opacity=".08"/>
          <rect x="21" y="21" width="348" height="298" stroke-width="1" opacity=".06"/>
          <!-- 中央编钟细线 -->
          <g stroke-width="1" opacity=".09">
            <path d="M182 128c0-12 26-12 26 0"/>
            <path d="M172 140q23-9 46 0"/>
            <path d="M172 140c-9 30-16 54-22 82"/>
            <path d="M218 140c9 30 16 54 22 82"/>
            <path d="M150 222q45-18 90 0"/>
          </g>
          <!-- 四角如意云 -->
          <g stroke-width="1" opacity=".08">
            <path d="M58 66q2-10 14-10q11 0 12 8q1 8-9 9"/>
            <path d="M84 72q18 3 34 12"/>
            <path d="M332 60q-2-10-14-10q-11 0-12 8q-1 8 9 9"/>
            <path d="M306 66q-18 3-34 12"/>
            <path d="M64 258q2 10 14 10q11 0 12-8"/>
            <path d="M326 252q-2 10-14 10q-11 0-12-8"/>
          </g>
          <!-- 底部细波浪两道 -->
          <g stroke-width="1" opacity=".07">
            <path d="M24 292q30-14 62-5t62 2t62-10t60 9t62-6t34 4"/>
            <path d="M24 306q30-10 62-4t62 1t62-8t60 7t62-5t34 3"/>
          </g>
        </svg>
        <div class="cap">
          <div class="ct">治学有序 · 教务有光</div>
          <div class="cs">砺蕴教务系统 · 二〇二六秋季学期 · 第九教学周</div>
        </div>
      </div>

      <!-- 屏 3 · 浅纸底 + 三张拍立得 -->
      <div class="lg-slide s3 lite">
        <div class="pols">
          <div class="pol p1">
            <img src="assets/press-boyi_5A244503.png" alt="教学楼">
            <span>教学楼</span>
          </div>
          <div class="pol p2">
            <img src="assets/press-boyi_E0B6CAF7.png" alt="演播室课堂">
            <span>演播室课堂</span>
          </div>
          <div class="pol p3">
            <img src="assets/press-boyi_38DA048D.png" alt="登上央视">
            <span>登上央视</span>
          </div>
        </div>
        <div class="cap">
          <div class="ct">从博艺，走向央视大舞台</div>
          <div class="cs">央视主播陈怡博 · 学子遍布中传、中戏、北电等名校</div>
        </div>
      </div>

      <!-- 屏 4 · 暖纸 + 校园剪影 -->
      <div class="lg-slide s4">
        <svg class="bgpat" viewBox="0 0 390 200" preserveAspectRatio="xMidYMax meet" fill="none" stroke="#5c4c2c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <!-- 中央塔楼 -->
          <path d="M186 150V96l9-24l9 24v54"/>
          <path d="M195 72v-14"/>
          <circle cx="195" cy="104" r="5"/>
          <!-- 两侧楼群 -->
          <path d="M120 150v-28h58M212 150v-24h62"/>
          <path d="M120 122h58M212 126h62"/>
          <!-- 树 -->
          <circle cx="62" cy="130" r="15"/>
          <path d="M62 145v5"/>
          <circle cx="322" cy="132" r="13"/>
          <path d="M322 145v5"/>
          <!-- 地面 -->
          <path d="M0 150h390"/>
          <!-- 水面波纹 -->
          <g stroke-width="1" opacity=".85">
            <path d="M22 164h34M84 170h44M148 162h38M238 168h46M312 162h32M56 180h52M182 176h62M296 178h44"/>
          </g>
        </svg>
        <div class="cap">
          <div class="ct">博艺，梦开始的地方</div>
          <div class="cs">白河之滨 · 向阳荷花广场 · 播音与主持艺考基地</div>
        </div>
      </div>
    </div>

    <!-- 圆点指示器 -->
    <div class="lg-dots">
      <i class="on"></i><i></i><i></i><i></i>
    </div>
  </div>

  <!-- 下部白色圆角大板 -->
  <div class="lg-board">
    <h1>欢迎登录</h1>
    <div class="wb-rule"></div>

    <!-- 角色胶囊：教师 / 学生 -->
    <div class="lg-roles">
      <div class="lg-role">
        <!-- 教师：执教鞭的简笔人像（1.5px） -->
        <svg width="20" height="20" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="8.5" r="3.8"/>
          <path d="M4.5 24c0-4.2 2.9-7 6.5-7 1.7 0 3.2.6 4.4 1.6"/>
          <path d="M14 18.5l5.5-3.5"/>
          <path d="M20 15.5l6.5 7.5"/>
          <path d="M26.5 23l1 .5"/>
        </svg>
        <span class="rt">教师</span>
      </div>
      <div class="lg-role sel">
        <!-- 学生：学士帽（1.5px，带流苏） -->
        <svg width="20" height="20" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 6.5L2.5 12.5 15 18.5l12.5-6L15 6.5z"/>
          <path d="M8 15.8v5c0 2.1 3.1 3.8 7 3.8s7-1.7 7-3.8v-5"/>
          <path d="M25.5 13.5v5.8"/>
          <circle cx="25.5" cy="20.6" r=".9"/>
        </svg>
        <span class="rt">学生</span>
      </div>
    </div>

    <!-- 账号 -->
    <label class="lg-field">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.8 3.6-6.5 8-6.5s8 2.7 8 6.5"/></svg>
      <input type="text" placeholder="请输入账号" autocomplete="off">
    </label>
    <!-- 密码 -->
    <label class="lg-field">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
      <input type="password" placeholder="请输入密码">
    </label>

    <button class="lg-btn">登 录</button>

    <div class="lg-rem">
      <span class="box">
        <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5L4.8 9 10 3.5"/></svg>
      </span>
      记住账号
    </div>

    <div class="lg-foot">
      <div class="slogan">廿二载深耕 · 一声一心传</div>
      <div class="copy">砺蕴教务系统 · 仅限授权账号登录</div>
    </div>
  </div>

  <script>
    // 轮播圆点联动：scroll-snap 滑动时高亮当前屏
    (function(){
      var track=document.getElementById('lgTrack');
      var dots=document.querySelectorAll('.lg-dots i');
      var raf=null;
      track.addEventListener('scroll',function(){
        if(raf)return;
        raf=requestAnimationFrame(function(){
          raf=null;
          var i=Math.round(track.scrollLeft/track.clientWidth);
          if(i<0)i=0;
          if(i>dots.length-1)i=dots.length-1;
          dots.forEach(function(d,k){d.classList.toggle('on',k===i);});
        });
      },{passive:true});
    })();
  </script>

</body>
</html>
