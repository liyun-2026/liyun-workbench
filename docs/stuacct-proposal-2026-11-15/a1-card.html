<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<title>A1 发放卡样张</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f7f6f2;font-family:'PingFang SC','Helvetica Neue',sans-serif;color:#2b3446;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:28px}
/* 裁切参考线 */
.cut{position:relative}
.cut::before{content:'';position:absolute;inset:-14px;border:1.5px dashed #c9ab7c;border-radius:20px;opacity:.65}
.cut::after{content:'✂ 沿虚线剪下，写上姓名后发给学生';position:absolute;top:-30px;left:50%;transform:translateX(-50%);
  font-size:12px;color:#a8895a;letter-spacing:.12em;white-space:nowrap}
.card{width:470px;background:#fff;border:1px solid #E7E3DA;border-radius:16px;
  box-shadow:0 1px 4px rgba(60,50,35,.07),0 18px 46px rgba(60,50,35,.13);overflow:hidden}
.goldbar{height:7px;background:linear-gradient(90deg,#c9ab7c,#a8895a 55%,#c9ab7c)}
.head{padding:22px 30px 0;text-align:center}
.school{font-family:'Songti SC','STSong',serif;font-size:13px;letter-spacing:.5em;color:#a8895a}
.title{font-family:'Songti SC','STSong',serif;font-size:24px;font-weight:700;letter-spacing:.14em;margin-top:10px;color:#2b3446}
.sub{font-size:12px;color:#8d877b;margin-top:7px;letter-spacing:.06em}
.rule{width:58px;height:4px;border-radius:999px;background:linear-gradient(90deg,#c9ab7c,#a8895a);margin:16px auto 0}
.who{display:flex;justify-content:center;gap:26px;margin-top:18px;font-size:13.5px}
.who b{font-family:'Songti SC',serif;color:#2b3a5e}
.who span{color:#6b7284;margin-right:5px;font-size:12px}
.creds{margin:20px 30px 0;background:#f7f6f2;border:1px solid rgba(201,171,124,.45);border-radius:14px;padding:18px 22px}
.cred{display:flex;align-items:baseline;justify-content:space-between;padding:9px 0}
.cred + .cred{border-top:1px dashed rgba(201,171,124,.5)}
.cred .k{font-size:12.5px;color:#7E6637;letter-spacing:.1em}
.cred .v{font-family:'Songti SC','Menlo',serif;font-size:23px;font-weight:700;color:#2b3446;letter-spacing:.06em}
.steps{margin:20px 30px 0;padding:0 6px}
.steps h4{font-size:13px;color:#7E6637;letter-spacing:.14em;margin-bottom:10px}
.steps ol{list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:11px;font-size:13.5px;line-height:1.55;margin:9px 0;color:#3c4557}
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:999px;
  background:linear-gradient(135deg,#c9ab7c,#a8895a);color:#fff;font-size:12.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:1px}
.steps li b{color:#2b3a5e}
.foot{margin-top:22px;padding:13px 30px 17px;background:#faf9f6;border-top:1px solid #E7E3DA;
  font-size:11.5px;color:#8d877b;line-height:1.7;text-align:center}
.foot b{color:#c0392b}
.addr{font-family:'Menlo',monospace;font-size:12px;color:#2b3a5e;letter-spacing:.02em}
</style></head><body>
<div class="cut">
  <div class="card">
    <div class="goldbar"></div>
    <div class="head">
      <div class="school">砺 蕴 教 务 系 统</div>
      <div class="title">学生账号发放卡</div>
      <div class="sub">请剪下随身保存 · 不要拍照外传</div>
      <div class="rule"></div>
    </div>
    <div class="who">
      <div><span>班级</span><b>初二 · 砺蕴二班</b></div>
      <div><span>姓名</span><b>王小明</b></div>
      <div><span>学号</span><b>12</b></div>
    </div>
    <div class="creds">
      <div class="cred"><span class="k">登 录 账 号</span><span class="v">By2401-12</span></div>
      <div class="cred"><span class="k">登 录 密 码</span><span class="v">by3729</span></div>
    </div>
    <div class="steps">
      <h4>三 步 上 手</h4>
      <ol>
        <li>浏览器打开登录地址：<span class="addr">liyun2026.top</span>（会自动记住）</li>
        <li>选「我是学生」，输入上面的<b>账号</b>和<b>密码</b></li>
        <li>打卡时点「今日打卡」，输老师屏幕上的 <b>6 位动态码</b></li>
      </ol>
    </div>
    <div class="foot">
      这张卡只属于你一个人 · <b>密码别告诉同学</b> · 第一台手机登录后自动绑定<br>
      换手机找教务老师要「换设备密钥」 · 忘了密码也找老师，一分钟重置
    </div>
  </div>
</div>
</body></html>
