<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<title>B1 首登强制改密弹窗</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e9e7e2;font-family:'PingFang SC','Helvetica Neue',sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:26px}
.phone{width:390px;height:760px;background:#f7f6f2;border-radius:44px;border:10px solid #2a2a2e;
  box-shadow:0 30px 80px rgba(60,50,35,.3);overflow:hidden;position:relative}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#2a2a2e;border-radius:0 0 16px 16px;z-index:5}
.pstatus{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;
  padding:14px 26px 0;font-size:13px;font-weight:600;color:#2b3446}
.mask{position:absolute;inset:0;background:rgba(30,34,44,.55);backdrop-filter:blur(2px);z-index:10}
/* 弹窗 */
.modal{position:absolute;z-index:11;left:20px;right:20px;top:120px;background:#fff;border-radius:20px;
  box-shadow:0 1px 4px rgba(60,50,35,.07),0 26px 64px rgba(30,34,44,.35);overflow:hidden}
.mgold{height:6px;background:linear-gradient(90deg,#c9ab7c,#a8895a)}
.mbody{padding:24px 26px 22px}
.shield{width:52px;height:52px;border-radius:999px;margin:0 auto;
  background:linear-gradient(135deg,rgba(201,171,124,.18),rgba(168,137,90,.10));
  border:1px solid rgba(201,171,124,.55);display:flex;align-items:center;justify-content:center;font-size:25px}
.mtitle{font-family:'Songti SC','STSong',serif;font-size:19px;font-weight:700;letter-spacing:.06em;
  text-align:center;margin-top:14px;color:#2b3446;line-height:1.5}
.msub{font-size:12.5px;color:#8d877b;text-align:center;margin-top:8px;line-height:1.7}
.msub b{color:#7E6637}
.field{margin-top:16px}
.field label{font-size:12px;color:#6b7284;letter-spacing:.08em;margin-bottom:6px;display:block}
.field input{width:100%;border:1px solid #E7E3DA;border-radius:10px;padding:12px 14px;font-size:15.5px;
  background:#fff;color:#2b3446;letter-spacing:.04em}
.field .r{font-size:11px;color:#8d877b;margin-top:6px}
.field .r i{font-style:normal;color:#2e7d54}
.mbtn{width:100%;margin-top:20px;padding:13.5px;border:0;border-radius:999px;cursor:pointer;
  background:linear-gradient(135deg,#c9ab7c,#a8895a);color:#fff;font-size:15.5px;font-weight:600;letter-spacing:.16em}
.mlink{text-align:center;font-size:11.5px;color:#a8895a;margin-top:12px;letter-spacing:.04em}
/* 弹窗背后隐约的学生首页 */
.behind{position:absolute;inset:0;padding:70px 20px 0;opacity:.32}
.bcard{background:#fff;border-radius:16px;border:1px solid #E7E3DA;padding:16px;margin-bottom:14px}
.bcard .l1{font-size:13px;color:#2b3446;font-weight:600}
.bcard .l2{font-size:11.5px;color:#8d877b;margin-top:5px}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:5px;
  border-radius:999px;background:#2a2a2e;opacity:.5;z-index:20}
</style></head><body>
<div class="phone">
  <div class="notch"></div>
  <div class="pstatus"><span>21:37</span><span>学生端 · 王小明</span></div>
  <div class="behind">
    <div class="bcard"><div class="l1">今日要闻</div><div class="l2">周日 · 无课 · 统考倒计时 106 天</div></div>
    <div class="bcard"><div class="l1">我的作业</div><div class="l2">代数同步练 §4.2 · 明天交</div></div>
    <div class="bcard"><div class="l1">今日打卡</div><div class="l2">到校后输老师的 6 位动态码</div></div>
  </div>
  <div class="mask"></div>
  <div class="modal">
    <div class="mgold"></div>
    <div class="mbody">
      <div class="shield">🔐</div>
      <div class="mtitle">为了账号安全，<br>先设一个你自己的密码</div>
      <div class="msub">现在是老师发的初始密码 <b>by3729</b>，全班都一样。<br>换成只有你知道的密码，以后就不用怕别人猜到啦。</div>
      <div class="field">
        <label>新密码（至少 6 位，要含数字）</label>
        <input type="password" value="wxm2026" readonly>
        <div class="r"><i>✓ 长度够</i> · <i>✓ 含数字</i> · 不能和初始密码一样</div>
      </div>
      <div class="field">
        <label>再输一遍</label>
        <input type="password" value="wxm2026" readonly>
        <div class="r"><i>✓ 两次一致</i></div>
      </div>
      <button class="mbtn">保 存 并 进 入</button>
      <div class="mlink">忘了刚设的密码？找教务老师一分钟重置</div>
    </div>
  </div>
  <div class="homebar"></div>
</div>
</body></html>
