<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>方案 B · 焦点式 · 教务首页</title>
<link rel="stylesheet" href="../theme-base.css">
<style>
  /* 内容短于视口时白板延伸到底 */
  .sheet{min-height:100vh}

  /* 紧凑 hero */
  .hero.compact{
    padding:calc(env(safe-area-inset-top) + 44px) 20px 34px;
    min-height:0;
  }
  .hero.compact .greet-row{display:flex;align-items:center;gap:10px}
  .role-badge{
    flex:none;display:inline-flex;align-items:center;gap:4px;
    height:20px;padding:0 9px;border-radius:10px;
    border:1px solid rgba(232,205,148,.65);color:#e8cd94;
    font-size:10px;letter-spacing:2px;text-indent:2px;
  }
  .role-badge svg{flex:none}

  /* 「此刻」大卡 */
  .now-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px 18px 18px;
    box-shadow:0 10px 28px rgba(43,58,94,.08);
  }
  .now-card .eyebrow{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;letter-spacing:2px;color:var(--gold-deep);
  }
  .now-card .eyebrow::before{
    content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);
  }
  .now-card .big{
    font-family:var(--serif);
    font-size:26px;font-weight:600;letter-spacing:1px;
    color:var(--blue-ink);margin-top:10px;line-height:1.3;
  }
  .now-card .nums{
    display:flex;margin-top:16px;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:12px 0;
  }
  .now-card .n{flex:1;text-align:center}
  .now-card .n + .n{border-left:1px solid var(--line)}
  .now-card .n .v{font-family:Georgia,var(--serif);font-size:22px;line-height:1.2;color:var(--blue)}
  .now-card .n.warn .v{color:#c44a3a}
  .now-card .n .k{font-size:11px;color:var(--ink-3);margin-top:2px}
  .now-card .bigbtn{margin-top:16px;min-height:48px}
  .now-card .win{
    text-align:center;font-size:11px;color:var(--ink-3);margin-top:10px;
  }

  /* 横滑摘要条 */
  .strip{
    display:flex;gap:8px;overflow-x:auto;
    margin-top:20px;padding:2px;
    scrollbar-width:none;
  }
  .strip::-webkit-scrollbar{display:none}
  .chip{
    flex:none;display:inline-flex;align-items:center;gap:6px;
    height:32px;padding:0 14px;border-radius:16px;
    background:#fff;border:1px solid var(--line);
    font-size:12px;color:var(--ink-2);
  }
  .chip b{font-family:Georgia,var(--serif);font-size:14px;color:var(--blue-ink)}
  .chip.hot{border-color:rgba(196,74,58,.45);background:rgba(196,74,58,.06)}
  .chip.hot b{color:#c44a3a}

  /* 待办紧凑卡 */
  .todo{
    display:flex;align-items:center;gap:10px;padding:12px 0;
  }
  .todo + .todo{border-top:1px solid var(--line)}
  .todo .info{flex:1;min-width:0}
  .todo .name{font-size:15px;font-weight:600}
  .todo .due{font-size:12px;color:var(--ink-2);margin-top:3px}
  .todo-card{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:2px 14px;margin-top:14px;
  }
  .pill{
    flex:none;display:inline-flex;align-items:center;height:22px;padding:0 10px;
    border-radius:11px;font-size:11px;line-height:1;white-space:nowrap;
  }
  .pill.gold{background:rgba(201,171,124,.16);color:var(--gold-deep)}
  .pill.red{background:rgba(196,74,58,.10);color:#c44a3a}

  /* 宫格 4 项 */
  .grid4{
    display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;
    margin-top:22px;
  }
  .gi{display:flex;flex-direction:column;align-items:center;gap:6px}
  .gi .tile{
    width:46px;height:46px;border-radius:13px;
    background:rgba(74,92,140,.08);
    display:flex;align-items:center;justify-content:center;color:var(--blue);
  }
  .gi .lb{font-size:11px;color:var(--ink-2)}

  .sec-t{
    font-family:var(--serif);font-size:15px;font-weight:600;
    color:var(--blue-ink);letter-spacing:1px;
    margin:24px 2px 10px;
  }
</style>
</head>
<body>

  <!-- 紧凑头 -->
  <div class="hero compact">
    <img class="bg-logo" src="../mark-liyun-gold.png" alt="">
    <div class="greet-row">
      <span class="greet">上午好，李老师</span>
      <span class="role-badge">
        <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 1.5l4 1.8v3c0 2.6-1.7 4-4 4.7-2.3-.7-4-2.1-4-4.7v-3L6 1.5z"/></svg>
        教务
      </span>
    </div>
    <div class="sub">10 月 21 日 星期三 · 第 9 教学周</div>
  </div>

  <!-- 白板叠头 -->
  <div class="sheet">

    <!-- ① 此刻大卡 -->
    <div class="now-card">
      <span class="eyebrow">此刻 · 第 1 节</span>
      <div class="big">上课中 · 全校实时</div>
      <div class="nums">
        <div class="n"><div class="v">38<small style="font-size:12px;font-family:var(--sans);color:var(--ink-3)">%</small></div><div class="k">全校出勤</div></div>
        <div class="n warn"><div class="v">6</div><div class="k">异常考勤</div></div>
        <div class="n"><div class="v">2</div><div class="k">在授班级</div></div>
      </div>
      <a class="bigbtn" href="#">
        <div>
          <div class="bt">查看考勤 →</div>
          <div class="bs">一班 09:30 起陆续到课</div>
        </div>
        <span class="go">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2.5h6v3H9z"/><path d="M8.5 12.5l2 2 4-4.5"/><path d="M9 17h6"/></svg>
        </span>
      </a>
      <div class="win">今日 8 节课 · 2 个班在授</div>
    </div>

    <!-- ② 横滑摘要条 -->
    <div class="strip">
      <span class="chip"><b>2</b> 待办</span>
      <span class="chip hot"><b>1</b> 待批请假</span>
      <span class="chip hot"><b>1</b> 缺勤上报</span>
    </div>

    <!-- ③ 待办两条 -->
    <div class="sec-t">待办事项</div>
    <div class="todo-card">
      <div class="todo">
        <div class="info">
          <div class="name">请假审批 · 1 条待批</div>
          <div class="due">一班陈同学 · 今天 08:50 提交 · 事假 1 天</div>
        </div>
        <span class="pill red">待批</span>
      </div>
      <div class="todo">
        <div class="info">
          <div class="name">缺勤上报 · 1 条</div>
          <div class="due">一班上午异常名单 · 今天 09:20 提交</div>
        </div>
        <span class="pill gold">待确认</span>
      </div>
    </div>

    <!-- ④ 快捷宫格 -->
    <div class="sec-t">快捷入口</div>
    <div class="grid4">
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2.5h6v3H9z"/><path d="M8.5 12.5l2 2 4-4.5"/><path d="M9 17h6"/></svg></span><span class="lb">考勤</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/><path d="M8 14h3M13 14h3M8 17.5h3"/></svg></span><span class="lb">排课</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h6"/></svg></span><span class="lb">作业</span></a>
      <a class="gi"><span class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span><span class="lb">更多</span></a>
    </div>

  </div>

  <!-- 底部 5-Tab（教务端） -->
  <nav class="tabbar">
    <a class="on" href="#">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></svg></span>
      首页
    </a>
    <a href="#">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2.5h6v3H9z"/><path d="M8.5 12l2 2 4-4.5"/><path d="M9 16.5h6"/></svg></span>
      考勤
    </a>
    <a href="#">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h6"/></svg></span>
      作业
    </a>
    <a href="#">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></span>
      课表
    </a>
    <a href="#">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.8 3.6-6.5 8-6.5s8 2.7 8 6.5"/></svg></span>
      我的
    </a>
  </nav>

</body>
</html>
