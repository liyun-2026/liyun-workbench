<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>版本二 · 教务首页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:#26262a}
.phone{position:relative;width:390px;height:844px;background:#f5f4f1;overflow:hidden;display:flex;flex-direction:column}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:#fff;flex-shrink:0}
.status .t{font-size:15px;font-weight:600;letter-spacing:.3px}
.status svg{display:block}
.hd{background:linear-gradient(180deg,#384a74 0%,#4a5c8c 100%);padding:8px 16px 40px;flex-shrink:0}
.hd-row{display:flex;align-items:center;height:36px}
.hd-row .name{font-size:19px;font-weight:700;color:#fff;letter-spacing:1px}
.hd-row .badge{font-size:10px;color:#384a74;background:#c9ab7c;border-radius:999px;padding:2px 8px;font-weight:600;margin-left:8px}
.hd-row .qr{margin-left:auto;color:#fff}
.search{margin-top:6px;height:38px;background:#fff;border-radius:999px;display:flex;align-items:center;padding:0 14px;gap:7px;color:#a3a3aa;font-size:14px}
.quick{margin-top:18px;display:flex}
.qk{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff}
.qk .lb{font-size:12px;color:rgba(255,255,255,.92)}
.overlap{background:#fff;border-radius:12px;margin:-20px 12px 0;padding:15px 4px 13px;position:relative;box-shadow:0 1px 3px rgba(28,28,30,.04);display:flex}
.ov{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;color:#4a5c8c}
.ov .lb{font-size:11.5px;color:#1c1c1e}
.sec{margin:16px 12px 0}
.sec-hd{display:flex;align-items:center;justify-content:space-between;height:30px;margin-bottom:8px}
.sec-hd .cap{font-size:13px;color:#85858b}
.sec-hd .more{font-size:12px;color:#85858b}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(28,28,30,.04)}
.lrow{display:flex;align-items:center;padding:14px 14px;gap:11px}
.lrow+.lrow{border-top:1px solid #eceae4}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lrow .bd{flex:1;min-width:0}
.lrow .tt{font-size:15px;color:#1c1c1e;font-weight:500}
.lrow .sb{font-size:12px;color:#85858b;margin-top:3px}
.lrow .rt{font-size:12px;color:#85858b;flex-shrink:0}
.tag{font-size:11px;border-radius:999px;padding:4px 10px;flex-shrink:0;font-weight:500}
.tag-gold{color:#a98a55;background:rgba(201,171,124,.16)}
.tag-red{color:#e0564a;background:rgba(224,86,74,.10)}
.tabbar{height:84px;background:#fff;border-top:1px solid #eceae4;display:flex;padding:6px 8px 0;flex-shrink:0;position:relative;z-index:9}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:4px}
.tb .lb{font-size:10px;color:#9a9aa1}
.tb.on .lb{color:#4a5c8c;font-weight:600}
.tb .icw{width:42px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.tb.on .icw{background:rgba(74,92,140,.10);color:#4a5c8c}
.tb:not(.on){color:#9a9aa1}
.hi{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#1c1c1e;opacity:.9}
</style>
</head>
<body>
<div class="phone">
  <div style="background:linear-gradient(180deg,#384a74 0%,#4a5c8c 100%);flex-shrink:0">
    <div class="status">
      <span class="t">9:41</span>
      <svg width="64" height="12" viewBox="0 0 64 12" fill="#fff"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="1" width="3" height="11" rx="1"/><path d="M28 5.5a8.5 8.5 0 0 1 11 0l-1.6 1.9a6 6 0 0 0-7.8 0z"/><circle cx="33.5" cy="9.5" r="1.8"/><rect x="44" y="2" width="17" height="8" rx="2.5" fill="none" stroke="#fff" stroke-opacity=".5"/><rect x="46" y="4" width="11" height="4" rx="1"/><path d="M62 4.5v3a2 2 0 0 0 0-3z"/></svg>
    </div>
    <div class="hd">
      <div class="hd-row">
        <span class="name">砺蕴</span><span class="badge">教务</span>
        <svg class="qr" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><rect x="4.5" y="4.5" width="6" height="6" rx="1"/><rect x="13.5" y="4.5" width="6" height="6" rx="1"/><rect x="4.5" y="13.5" width="6" height="6" rx="1"/><path d="M14 14h2.2v2.2H14zM17.8 14H20v2.2h-2.2zM14 17.8h2.2V20H14zM17.8 17.8H20V20h-2.2z" fill="#fff" stroke="none"/></svg>
      </div>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3aa" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        搜索学员/班级/待办
      </div>
      <div class="quick">
        <div class="qk"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5" width="13" height="16" rx="2"/><rect x="9" y="3.5" width="6" height="3" rx="1"/><path d="M9.5 13.5l2 2 3.5-4"/></svg><span class="lb">考勤</span></div>
        <div class="qk"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M4 10.5h16M8.5 3.5v4M15.5 3.5v4M12 13v4M10 15h4"/></svg><span class="lb">排课</span></div>
        <div class="qk"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="3.5" width="13" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3.5"/></svg><span class="lb">作业</span></div>
        <div class="qk"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v1.5a2.5 2.5 0 0 0 0 5V16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-1.5a2.5 2.5 0 0 0 0-5z"/><path d="M14 6.5v11" stroke-dasharray="2.5 2.5"/></svg><span class="lb">工单</span></div>
      </div>
    </div>
  </div>

  <div style="flex:1;position:relative;overflow:hidden">
    <!-- 白卡 icon 行 -->
    <div class="overlap">
      <div class="ov"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5" width="13" height="16" rx="2"/><rect x="9" y="3.5" width="6" height="3" rx="1"/><path d="M9.5 13.5l2 2 3.5-4"/></svg><span class="lb">考勤录入</span></div>
      <div class="ov"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="3.5" width="13" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3.5"/></svg><span class="lb">作业管理</span></div>
      <div class="ov"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.8" r="3.2"/><path d="M3.5 19.4c1-2.9 3.1-4.4 5.5-4.4s4.5 1.5 5.5 4.4"/><path d="M15.5 6.2a3.2 3.2 0 0 1 0 5.2M17.5 15.3c1.6.7 2.7 2.1 3.3 4.1"/></svg><span class="lb">我的班级</span></div>
      <div class="ov"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a6 6 0 0 1 6 6v3.2l1.5 2.8H4.5L6 13.2V10a6 6 0 0 1 6-6z"/><path d="M10 19.5a2 2 0 0 0 4 0"/></svg><span class="lb">教务通知</span></div>
      <div class="ov" style="color:#85858b"><svg width="23" height="23" viewBox="0 0 24 24" fill="currentColor"><rect x="4.5" y="4.5" width="6.5" height="6.5" rx="2"/><rect x="13" y="4.5" width="6.5" height="6.5" rx="2"/><rect x="4.5" y="13" width="6.5" height="6.5" rx="2"/><rect x="13" y="13" width="6.5" height="6.5" rx="2"/></svg><span class="lb">更多</span></div>
    </div>

    <!-- 今日概况 -->
    <div class="sec">
      <div class="sec-hd"><span class="cap">今日概况</span><span class="more">更多 ›</span></div>
      <div class="card">
        <div class="lrow">
          <span class="dot" style="background:#4a5c8c"></span>
          <div class="bd"><div class="tt">今日出勤 38% · 异常 6 人</div><div class="sb">13 位在读学员 · 缺勤上报 1 条</div></div>
          <span class="rt">今天</span>
        </div>
        <div class="lrow">
          <span class="dot" style="background:#34a36b"></span>
          <div class="bd"><div class="tt">今日 8 节课 · 2 个班在读</div><div class="sb">砺蕴一班 / 砺蕴二班 · BY05 · BY08</div></div>
          <span class="rt">今天</span>
        </div>
      </div>
    </div>

    <!-- 待办 -->
    <div class="sec">
      <div class="sec-hd"><span class="cap">待办</span><span class="more">更多 ›</span></div>
      <div class="card">
        <div class="lrow">
          <span class="dot" style="background:#c9ab7c"></span>
          <div class="bd"><div class="tt">请假审批 · 赵一诺（病假）</div><div class="sb">今天 09:20 提交</div></div>
          <span class="tag tag-gold">待审批</span>
        </div>
        <div class="lrow">
          <span class="dot" style="background:#e0564a"></span>
          <div class="bd"><div class="tt">缺勤上报 · 1 条待处理</div><div class="sb">砺蕴一班 · 今早第 1 节未到</div></div>
          <span class="tag tag-red">待处理</span>
        </div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tb on"><div class="icw"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11 12 4.8 19.5 11v7.5a1.5 1.5 0 0 1-1.5 1.5h-3.8v-5h-4.4v5H6a1.5 1.5 0 0 1-1.5-1.5z"/></svg></div><span class="lb">首页</span></div>
    <div class="tb"><div class="icw"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5" width="13" height="16" rx="2"/><rect x="9" y="3.5" width="6" height="3" rx="1"/><path d="M9.5 13.5l2 2 3.5-4"/></svg></div><span class="lb">考勤</span></div>
    <div class="tb"><div class="icw"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="3.5" width="13" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3.5"/></svg></div><span class="lb">作业</span></div>
    <div class="tb"><div class="icw"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M4 10.5h16M8.5 3.5v4M15.5 3.5v4"/></svg></div><span class="lb">课表</span></div>
    <div class="tb"><div class="icw"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.3" r="3.6"/><path d="M5.2 19.6c1.2-3.3 3.7-5 6.8-5s5.6 1.7 6.8 5"/></svg></div><span class="lb">我的</span></div>
    <div class="hi"></div>
  </div>
</div>
</body>
</html>
