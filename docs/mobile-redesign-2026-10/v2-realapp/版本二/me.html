<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>版本二 · 我的</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:#26262a}
.phone{position:relative;width:390px;height:844px;background:#f5f4f1;overflow:hidden;display:flex;flex-direction:column}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:#fff;flex-shrink:0}
.status .t{font-size:15px;font-weight:600;letter-spacing:.3px}
.status svg{display:block}
.hd{background:linear-gradient(180deg,#384a74 0%,#4a5c8c 100%);padding:10px 20px 58px;position:relative;overflow:hidden;flex-shrink:0}
.hd .emb{position:absolute;right:14px;top:44px;width:150px;opacity:.18}
.hd-row{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.ava{width:58px;height:58px;border-radius:50%;background:#fff;color:#4a5c8c;font-size:23px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.65);flex-shrink:0}
.who .nm{font-size:18px;font-weight:700;color:#fff}
.who .sb{font-size:12px;color:rgba(255,255,255,.72);margin-top:4px}
.hd .qr{margin-left:auto;color:#fff;position:relative;z-index:1}
/* 余额卡 */
.bal{background:#fff;border-radius:12px;margin:-14px 12px 0;padding:16px;display:flex;align-items:center;position:relative;box-shadow:0 1px 3px rgba(28,28,30,.04)}
.bal .cap{font-size:13px;color:#85858b;display:flex;align-items:center;gap:6px}
.bal .num{font-size:28px;font-weight:700;color:#1c1c1e;margin-top:4px}
.bal .num small{font-size:13px;font-weight:500;color:#85858b;margin-left:4px}
.bal .ops{margin-left:auto;display:flex;gap:26px}
.op{display:flex;flex-direction:column;align-items:center;gap:5px;color:#4a5c8c}
.op .lb{font-size:11px;color:#1c1c1e}
/* 分组列表 */
.grp{margin:14px 12px 0}
.grp .cap{font-size:12px;color:#85858b;padding:0 4px 7px}
.grp .card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(28,28,30,.04)}
.row{display:flex;align-items:center;height:48px;padding:0 16px;font-size:15px;color:#1c1c1e}
.row+.row{border-top:1px solid #eceae4}
.row .chev{margin-left:auto;color:#c7c7cc}
.row .val{margin-left:auto;font-size:13px;color:#85858b}
.row .val+.chev{margin-left:4px}
.row.logout{color:#e0564a;justify-content:center;font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:#e0564a;margin-left:auto;margin-right:6px}
/* 水印 */
.wm{position:absolute;left:-30%;top:250px;width:160%;height:800px;transform:rotate(-32deg);pointer-events:none;opacity:.08;z-index:1;overflow:hidden}
.wm div{font-size:15px;color:#4a5c8c;font-weight:600;letter-spacing:2px;white-space:nowrap;line-height:110px}
.tabbar{height:84px;background:#fff;border-top:1px solid #eceae4;display:flex;padding:6px 8px 0;flex-shrink:0;position:relative;z-index:9;margin-top:auto}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:4px}
.tb .lb{font-size:10px;color:#9a9aa1}
.tb.on .lb{color:#4a5c8c;font-weight:600}
.tb .icw{width:42px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.tb.on .icw{background:rgba(74,92,140,.10);color:#4a5c8c}
.tb:not(.on){color:#9a9aa1}
.hi{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#1c1c1e;opacity:.9}
</style>
</head>
