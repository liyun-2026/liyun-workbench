<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>版本一 · 我的</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:#26262a}
.phone{position:relative;width:390px;height:844px;background:#f5f4f1;overflow:hidden;display:flex;flex-direction:column}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:#fff;flex-shrink:0}
.status .t{font-size:15px;font-weight:600;letter-spacing:.3px}
.status svg{display:block}
/* 蓝头（仅本页保留）：高度收小 + 左下右下圆角，不遮挡下方内容 */
.hd{background:linear-gradient(180deg,#384a74 0%,#4a5c8c 100%);padding:10px 20px 22px;position:relative;overflow:hidden;flex-shrink:0;border-radius:0 0 20px 20px}
.hd .emb{position:absolute;right:14px;bottom:-12px;width:120px;opacity:.18}
.hd-row{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.ava{width:52px;height:52px;border-radius:50%;background:#fff;color:#4a5c8c;font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.65);flex-shrink:0}
.who .nm{font-size:18px;font-weight:700;color:#fff}
.who .sb{font-size:12px;color:rgba(255,255,255,.72);margin-top:4px}
.hd .qr{margin-left:auto;color:#fff;position:relative;z-index:1}
/* 白卡统计：随蓝框收小改为正常流，不再叠压 */
.stats{background:#fff;border-radius:12px;margin:14px 12px 0;display:flex;padding:14px 0;position:relative;box-shadow:0 1px 3px rgba(28,28,30,.04)}
.st{flex:1;text-align:center}
.st+.st{border-left:1px solid #eceae4}
.st .num{font-size:22px;font-weight:700;color:#1c1c1e}
.st .lb{font-size:12px;color:#85858b;margin-top:3px}
/* 分组列表 */
.grp{margin:11px 12px 0}
.grp .cap{font-size:12px;color:#85858b;padding:0 4px 7px}
.grp .card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(28,28,30,.04)}
.row{display:flex;align-items:center;height:46px;padding:0 16px;font-size:15px;color:#1c1c1e}
.row+.row{border-top:1px solid #eceae4}
.row .chev{margin-left:auto;color:#c7c7cc}
.row .val{margin-left:auto;font-size:13px;color:#85858b}
.row .val+.chev{margin-left:4px}
.row .ic{width:24px;height:24px;margin-right:10px;color:#4a5c8b;color:#4a5c8c}
.row.logout{color:#e0564a;justify-content:center;font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:#e0564a;margin-left:auto;margin-right:6px}
.tabbar{height:84px;background:#fff;border-top:1px solid #eceae4;display:flex;padding:6px 8px 0;flex-shrink:0;position:relative;margin-top:auto}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:5px}
.tb .lb{font-size:10px;color:#9a9aa1}
.tb.on .lb{color:#4a5c8c;font-weight:600}
.tb.on svg{color:#4a5c8c}
.hi{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#1c1c1e;opacity:.9}
</style>
</head>
<body>
<div class="phone">
  <div style="background:linear-gradient(180deg,#384a74 0%,#4a5c8c 100%);flex-shrink:0;border-radius:0 0 20px 20px;overflow:hidden">
    <div class="status">
      <span class="t">9:41</span>
      <svg width="64" height="12" viewBox="0 0 64 12" fill="#fff"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="1" width="3" height="11" rx="1"/><path d="M28 5.5a8.5 8.5 0 0 1 11 0l-1.6 1.9a6 6 0 0 0-7.8 0z"/><circle cx="33.5" cy="9.5" r="1.8"/><rect x="44" y="2" width="17" height="8" rx="2.5" fill="none" stroke="#fff" stroke-opacity=".5"/><rect x="46" y="4" width="11" height="4" rx="1"/><path d="M62 4.5v3a2 2 0 0 0 0-3z"/></svg>
    </div>
    <div class="hd">
      <img class="emb" src="../assets/mark-liyun-gold.png" alt="">
      <div class="hd-row">
        <div class="ava">李</div>
        <div class="who">
          <div class="nm">李老师</div>
          <div class="sb">砺蕴教务 · 教务管理员</div>
        </div>
        <svg class="qr" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><rect x="4.5" y="4.5" width="6" height="6" rx="1"/><rect x="13.5" y="4.5" width="6" height="6" rx="1"/><rect x="4.5" y="13.5" width="6" height="6" rx="1"/><path d="M14 14h2.2v2.2H14zM17.8 14H20v2.2h-2.2zM14 17.8h2.2V20H14zM17.8 17.8H20V20h-2.2z" fill="#fff" stroke="none"/></svg>
      </div>
    </div>
  </div>

  <div style="flex:1;overflow:hidden">
    <!-- 统计行：不显示课时类数据（余额/已上），只留中性字段 -->
    <div class="stats">
      <div class="st"><div class="num">2</div><div class="lb">任教班级</div></div>
      <div class="st"><div class="num">13</div><div class="lb">在读学员</div></div>
      <div class="st"><div class="num">3</div><div class="lb">请假</div></div>
    </div>

    <div class="grp">
      <div class="cap">个人</div>
      <div class="card">
        <div class="row">我的档案<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6 6.5-6 6.5"/></svg></div>
        <div class="row">我的作业<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6 6.5-6 6.5"/></svg></div>
      </div>
    </div>

    <div class="grp">
      <div class="cap">校园</div>
      <div class="card">
        <div class="row">给老师发消息<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6 6.5-6 6.5"/></svg></div>
        <div class="row">限时征集<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6 6.5-6 6.5"/></svg></div>
        <div class="row">我的课表<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6 6.5-6 6.5"/></svg></div>
      </div>
    </div>

    <div class="grp">
      <div class="cap">其他</div>
      <div class="card">
        <div class="row">账号信息<span class="val">LY2608</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6 6.5-6 6.5"/></svg></div>
        <div class="row">帮助与反馈<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6 6.5-6 6.5"/></svg></div>
        <div class="row">设置<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6 6.5-6 6.5"/></svg></div>
        <div class="row logout">退出登录</div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11 12 4.8 19.5 11v7.5a1.5 1.5 0 0 1-1.5 1.5h-3.8v-5h-4.4v5H6a1.5 1.5 0 0 1-1.5-1.5z"/></svg><span class="lb">首页</span></div>
    <div class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5" width="13" height="16" rx="2"/><rect x="9" y="3.5" width="6" height="3" rx="1"/><path d="M9.5 13.5l2 2 3.5-4"/></svg><span class="lb">考勤</span></div>
    <div class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="3.5" width="13" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3.5"/></svg><span class="lb">作业</span></div>
    <div class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M4 10.5h16M8.5 3.5v4M15.5 3.5v4"/></svg><span class="lb">课表</span></div>
    <div class="tb on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.3" r="3.6"/><path d="M5.2 19.6c1.2-3.3 3.7-5 6.8-5s5.6 1.7 6.8 5"/></svg><span class="lb">我的</span></div>
    <div class="hi"></div>
  </div>
</div>
</body>
</html>
