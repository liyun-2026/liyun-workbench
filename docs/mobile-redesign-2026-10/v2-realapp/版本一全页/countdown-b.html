<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>统考倒计时轮播卡 · 方案 B 深蓝夜读卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:#26262a}
.phone{position:relative;width:390px;height:844px;background:#f5f4f1;overflow:hidden;display:flex;flex-direction:column}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:#1c1c1e;flex-shrink:0}
.status .t{font-size:15px;font-weight:600;letter-spacing:.3px}
.cap{padding:10px 20px 0;display:flex;align-items:baseline}
.cap .k{font-size:17px;font-weight:700;color:#1c1c1e;letter-spacing:.5px}
.cap .v{margin-left:auto;font-size:12px;font-weight:700;color:#4a5c8c;background:rgba(74,92,140,.10);border-radius:999px;padding:4px 12px}
.hint{padding:6px 20px 0;font-size:12px;color:#85858b;line-height:1.6}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 0 60px}
/* —— 方案 B 卡本体：深蓝是卡片，不是页头 —— */
.cardB{margin:0 24px;background:linear-gradient(135deg,#384a74 0%,#4a5c8c 100%);border-radius:16px;padding:20px 22px 18px;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(56,74,116,.32)}
.cardB .star{position:absolute;border-radius:50%;background:#fff}
.cardB .s1{width:2px;height:2px;opacity:.5;top:18px;left:34px}
.cardB .s2{width:3px;height:3px;opacity:.35;top:34px;right:70px}
.cardB .s3{width:2px;height:2px;opacity:.4;top:64px;right:30px}
.cardB .s4{width:2px;height:2px;opacity:.3;bottom:34px;left:56px}
.cardB .s5{width:3px;height:3px;opacity:.25;bottom:20px;right:120px}
.cardB .moon{position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.06)}
.cardB .moon::after{content:'';position:absolute;right:14px;top:10px;width:82px;height:82px;border-radius:50%;background:rgba(255,255,255,.05)}
.cardB .lab{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.cardB .lab .k{font-size:12px;font-weight:600;color:#e8cf9e;letter-spacing:2px}
.cardB .lab .sub{margin-left:auto;font-size:11px;color:rgba(255,255,255,.55)}
.cardB .mid{display:flex;align-items:baseline;gap:10px;margin-top:14px;position:relative;z-index:1}
.cardB .n{font-size:78px;font-weight:900;color:#e8cf9e;font-family:'Songti SC','STSong','SimSun',serif;line-height:.9;letter-spacing:-1px}
.cardB .u{font-size:26px;font-weight:700;color:#e8cf9e;font-family:'Songti SC','STSong','SimSun',serif}
.cardB .e{margin-left:auto;text-align:right;font-size:13px;color:rgba(255,255,255,.92);font-weight:600;line-height:1.5}
.cardB .e small{display:block;font-size:11px;color:rgba(255,255,255,.62);font-weight:400;margin-top:3px}
.cardB .ft{margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.16);display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.62);position:relative;z-index:1}
.cardB .ft b{color:#e8cf9e;font-weight:600}
.dots{display:flex;gap:6px;justify-content:center;margin-top:22px}
.dots i{width:6px;height:6px;border-radius:50%;background:#d8d5cd}
.dots i.on{background:#4a5c8c;width:16px;border-radius:3px}
</style>
</head>
<body>
<div class="phone">
  <div class="status">
    <span class="t">9:41</span>
    <svg width="64" height="12" viewBox="0 0 64 12" fill="#1c1c1e"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="1" width="3" height="11" rx="1"/><path d="M28 5.5a8.5 8.5 0 0 1 11 0l-1.6 1.9a6 6 0 0 0-7.8 0z"/><circle cx="33.5" cy="9.5" r="1.8"/><rect x="44" y="2" width="17" height="8" rx="2.5" fill="none" stroke="#1c1c1e" stroke-opacity=".5"/><rect x="46" y="4" width="11" height="4" rx="1"/><path d="M62 4.5v3a2 2 0 0 0 0-3z"/></svg>
  </div>

  <div class="cap"><span class="k">统考倒计时轮播卡 · 方案 B</span><span class="v">深蓝夜读卡</span></div>
  <p class="hint">保留一抹深蓝，但收成轮播中的一张卡片而非页头；金字大数字＋星点暗月，庄重安静，适合夜间查看。</p>

  <div class="stage">
    <div class="cardB">
      <span class="star s1"></span><span class="star s2"></span><span class="star s3"></span><span class="star s4"></span><span class="star s5"></span>
      <span class="moon"></span>
      <div class="lab"><span class="k">统考倒计时</span><span class="sub">第 2 / 3 张 · 左右滑动</span></div>
      <div class="mid">
        <span class="n">41</span><span class="u">天</span>
        <span class="e">播音与主持类 · 省统考<small>笔试 2027.01.09（周六）09:00</small></span>
      </div>
      <div class="ft"><span>报名已确认 · 备考 51 天</span><span><b>距面试 88 天</b></span></div>
    </div>
    <div class="dots"><i></i><i class="on"></i><i></i></div>
  </div>
</div>
</body>
</html>
