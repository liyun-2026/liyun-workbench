<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>⑪ 教务·考勤录入</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:#26262a}
.phone{position:relative;width:390px;height:844px;background:#f5f4f1;overflow:hidden;display:flex;flex-direction:column}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:#1c1c1e;flex-shrink:0}
.status .t{font-size:15px;font-weight:600;letter-spacing:.3px}
.status svg{display:block}
.pt{padding:4px 16px 0;flex-shrink:0;display:flex;align-items:baseline}
.pt .tt{font-size:24px;font-weight:800;color:#1c1c1e;letter-spacing:.5px}
.pt .dt{margin-left:auto;font-size:12px;color:#85858b}
.sel{background:#fff;border-radius:12px;margin:14px 12px 0;padding:12px 12px 10px;position:relative;box-shadow:0 1px 3px rgba(28,28,30,.04)}
.sel .cap{font-size:11.5px;color:#85858b;margin:0 2px 6px}
.chips{display:flex;gap:8px}
.chip{font-size:12.5px;color:#85858b;background:#f2f1ed;border-radius:999px;padding:5px 13px;font-weight:500}
.chip.on{background:rgba(74,92,140,.10);color:#4a5c8c;font-weight:600}
.sumrow{display:flex;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid #eceae4;font-size:12.5px;color:#85858b}
.sumrow b{color:#4a5c8c;font-weight:700;font-size:15px}
.sumrow .save{margin-left:auto;font-size:12px;color:#fff;background:#4a5c8c;border-radius:999px;padding:6px 16px;font-weight:600}
.list{margin:10px 12px 0;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(28,28,30,.04);overflow:hidden;flex:1}
.prow{display:flex;align-items:center;height:47px;padding:0 14px}
.prow+.prow{border-top:1px solid #eceae4}
.prow .nm{font-size:14px;color:#1c1c1e}
.pills{margin-left:auto;display:flex;gap:6px}
.pl{font-size:11px;border-radius:999px;padding:4px 10px;font-weight:500;color:#85858b;background:#f2f1ed}
.pl.on{color:#4a5c8c;background:rgba(74,92,140,.10);font-weight:600}
.tabbar{height:84px;background:#fff;border-top:1px solid #eceae4;display:flex;padding:6px 8px 0;flex-shrink:0;position:relative;z-index:9;margin-top:auto}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:5px}
.tb .lb{font-size:10px;color:#9a9aa1}
.tb.on .lb{color:#4a5c8c;font-weight:600}
.tb.on svg{color:#4a5c8c}
.hi{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#1c1c1e;opacity:.9}
</style>
</head>
<body>
<div class="phone">
  <div class="status">
    <span class="t">9:41</span>
    <svg width="64" height="12" viewBox="0 0 64 12" fill="#1c1c1e"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="1" width="3" height="11" rx="1"/><path d="M28 5.5a8.5 8.5 0 0 1 11 0l-1.6 1.9a6 6 0 0 0-7.8 0z"/><circle cx="33.5" cy="9.5" r="1.8"/><rect x="44" y="2" width="17" height="8" rx="2.5" fill="none" stroke="#1c1c1e" stroke-opacity=".5"/><rect x="46" y="4" width="11" height="4" rx="1"/><path d="M62 4.5v3a2 2 0 0 0 0-3z"/></svg>
  </div>
  <div class="pt"><span class="tt">考勤录入</span><span class="dt">10月21日 · 周三</span></div>

  <div style="flex:1;overflow:hidden;display:flex;flex-direction:column">
    <div class="sel">
      <div class="cap">班级</div>
      <div class="chips"><span class="chip on">砺蕴一班</span><span class="chip">砺蕴二班</span></div>
      <div class="cap" style="margin-top:10px">节次</div>
      <div class="chips"><span class="chip on">第1节</span><span class="chip">第2节</span><span class="chip">第3节</span><span class="chip">第4节</span></div>
      <div class="sumrow">已录 <b>8</b>/13 · 到课 7 · 缺勤 1<span class="save">保存</span></div>
    </div>

    <div class="list">
      <div class="prow"><span class="nm">陈同学</span><div class="pills"><span class="pl on">到课</span><span class="pl">缺勤</span><span class="pl">请假</span></div></div>
      <div class="prow"><span class="nm">赵一诺</span><div class="pills"><span class="pl">到课</span><span class="pl">缺勤</span><span class="pl on">请假</span></div></div>
      <div class="prow"><span class="nm">林一一</span><div class="pills"><span class="pl on">到课</span><span class="pl">缺勤</span><span class="pl">请假</span></div></div>
      <div class="prow"><span class="nm">王梓轩</span><div class="pills"><span class="pl">到课</span><span class="pl on">缺勤</span><span class="pl">请假</span></div></div>
      <div class="prow"><span class="nm">周子墨</span><div class="pills"><span class="pl on">到课</span><span class="pl">缺勤</span><span class="pl">请假</span></div></div>
      <div class="prow"><span class="nm">吴悠</span><div class="pills"><span class="pl on">到课</span><span class="pl">缺勤</span><span class="pl">请假</span></div></div>
      <div class="prow"><span class="nm">郑好</span><div class="pills"><span class="pl on">到课</span><span class="pl">缺勤</span><span class="pl">请假</span></div></div>
      <div class="prow"><span class="nm">孙可</span><div class="pills"><span class="pl on">到课</span><span class="pl">缺勤</span><span class="pl">请假</span></div></div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11 12 4.8 19.5 11v7.5a1.5 1.5 0 0 1-1.5 1.5h-3.8v-5h-4.4v5H6a1.5 1.5 0 0 1-1.5-1.5z"/></svg><span class="lb">首页</span></div>
    <div class="tb on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5" width="13" height="16" rx="2"/><rect x="9" y="3.5" width="6" height="3" rx="1"/><path d="M9.5 13.5l2 2 3.5-4"/></svg><span class="lb">考勤</span></div>
    <div class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="3.5" width="13" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3.5"/></svg><span class="lb">作业</span></div>
    <div class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M4 10.5h16M8.5 3.5v4M15.5 3.5v4"/></svg><span class="lb">课表</span></div>
    <div class="tb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.3" r="3.6"/><path d="M5.2 19.6c1.2-3.3 3.7-5 6.8-5s5.6 1.7 6.8 5"/></svg><span class="lb">我的</span></div>
    <div class="hi"></div>
  </div>
</div>
</body>
</html>
