<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>统考倒计时轮播卡 · 方案 A 素笺大数字</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:#26262a}
.phone{position:relative;width:390px;height:844px;background:#f5f4f1;overflow:hidden;display:flex;flex-direction:column}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:#1c1c1e;flex-shrink:0}
.status .t{font-size:15px;font-weight:600;letter-spacing:.3px}
.cap{padding:10px 20px 0;display:flex;align-items:baseline}
.cap .k{font-size:17px;font-weight:700;color:#1c1c1e;letter-spacing:.5px}
.cap .v{margin-left:auto;font-size:12px;font-weight:700;color:#a98a55;background:rgba(201,171,124,.16);border-radius:999px;padding:4px 12px}
.hint{padding:6px 20px 0;font-size:12px;color:#85858b;line-height:1.6}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 0 60px}
/* —— 方案 A 卡本体 —— */
.cardA{margin:0 24px;background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(28,28,30,.06);padding:20px 22px 18px;position:relative}
.cardA .lab{display:flex;align-items:center;gap:8px}
.cardA .lab .k{font-size:12px;font-weight:600;color:#a98a55;letter-spacing:2px}
.cardA .lab .sub{margin-left:auto;font-size:11px;color:#a3a3aa}
.cardA .mid{display:flex;align-items:center;margin-top:14px}
.cardA .big{display:flex;align-items:baseline;gap:8px}
.cardA .n{font-size:76px;font-weight:900;color:#1c1c1e;font-family:'Songti SC','STSong','SimSun',serif;line-height:.9;letter-spacing:-1px}
.cardA .u{font-size:26px;font-weight:700;color:#fff;-webkit-text-stroke:1.6px #b99a63;font-family:'Songti SC','STSong','SimSun',serif}
.cardA .sep{width:1px;height:64px;background:#eceae4;margin:0 20px}
.cardA .info{flex:1;min-width:0}
.cardA .info .e{font-size:14px;font-weight:600;color:#1c1c1e}
.cardA .info .d{font-size:12px;color:#85858b;margin-top:5px}
.cardA .info .d b{color:#a98a55;font-weight:700}
.cardA .ft{margin-top:16px;padding-top:12px;border-top:1px solid #eceae4;display:flex;justify-content:space-between;font-size:11px;color:#a3a3aa}
.dots{display:flex;gap:6px;justify-content:center;margin-top:22px}
.dots i{width:6px;height:6px;border-radius:50%;background:#d8d5cd}
.dots i.on{background:#c9ab7c;width:16px;border-radius:3px}
</style>
</head>
<body>
<div class="phone">
  <div class="status">
    <span class="t">9:41</span>
    <svg width="64" height="12" viewBox="0 0 64 12" fill="#1c1c1e"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="1" width="3" height="11" rx="1"/><path d="M28 5.5a8.5 8.5 0 0 1 11 0l-1.6 1.9a6 6 0 0 0-7.8 0z"/><circle cx="33.5" cy="9.5" r="1.8"/><rect x="44" y="2" width="17" height="8" rx="2.5" fill="none" stroke="#1c1c1e" stroke-opacity=".5"/><rect x="46" y="4" width="11" height="4" rx="1"/><path d="M62 4.5v3a2 2 0 0 0 0-3z"/></svg>
  </div>

  <div class="cap"><span class="k">统考倒计时轮播卡 · 方案 A</span><span class="v">素笺大数字</span></div>
  <p class="hint">浅底白卡，超大宋体数字＋金色描边「天」；右侧细线分隔后列考试日期，最素净的一款。</p>

  <div class="stage">
    <div class="cardA">
      <div class="lab"><span class="k">统考倒计时</span><span class="sub">第 2 / 3 张 · 左右滑动</span></div>
      <div class="mid">
        <div class="big"><span class="n">41</span><span class="u">天</span></div>
        <div class="sep"></div>
        <div class="info">
          <div class="e">播音与主持类 · 省统考</div>
          <div class="d">笔试 <b>2027.01.09</b>（周六）09:00</div>
          <div class="d">面试 2027.01.17 · 考点待公告</div>
        </div>
      </div>
      <div class="ft"><span>报名已确认</span><span>准考证 · 考前 7 天开放打印</span></div>
    </div>
    <div class="dots"><i></i><i class="on"></i><i></i></div>
  </div>
</div>
</body>
</html>
