<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>⑨ 教师·考勤查看</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:#26262a}
.phone{position:relative;width:390px;height:844px;background:#f5f4f1;overflow:hidden;display:flex;flex-direction:column}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:#1c1c1e;flex-shrink:0}
.status .t{font-size:15px;font-weight:600;letter-spacing:.3px}
.status svg{display:block}
.pt{padding:4px 16px 0;flex-shrink:0;display:flex;align-items:center}
.pt .tt{font-size:24px;font-weight:800;color:#1c1c1e;letter-spacing:.5px}
.pt .ro{margin-left:10px;font-size:10px;color:#a98a55;background:rgba(201,171,124,.16);border-radius:5px;padding:3px 7px;letter-spacing:1px;font-weight:600}
.pt .dt{margin-left:auto;font-size:12px;color:#85858b}
.fbar{margin:12px 12px 0;background:#fff;border-radius:12px;padding:10px 12px;display:flex;gap:8px;box-shadow:0 1px 3px rgba(28,28,30,.04);flex-shrink:0}
.chip{font-size:12.5px;color:#85858b;background:#f2f1ed;border-radius:999px;padding:5px 14px;font-weight:500}
.chip.on{background:rgba(74,92,140,.10);color:#4a5c8c;font-weight:600}
.sum{margin:10px 12px 0;background:#fff;border-radius:12px;display:flex;padding:11px 0;position:relative;box-shadow:0 1px 3px rgba(28,28,30,.04);flex-shrink:0}
.s{flex:1;text-align:center}
.s+.s{border-left:1px solid #eceae4}
.s .num{font-size:17px;font-weight:700}
.s .lb{font-size:11px;color:#85858b;margin-top:1px}
.list{margin:10px 12px 0;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(28,28,30,.04);overflow:hidden;flex:1}
.prow{display:flex;align-items:center;height:40px;padding:0 14px}
.prow+.prow{border-top:1px solid #eceae4}
.prow .nm{font-size:14px;color:#1c1c1e}
.prow .sid{font-size:11px;color:#a3a3aa;margin-left:8px}
.tag{margin-left:auto;font-size:11px;border-radius:999px;padding:3px 11px;font-weight:500}
.tag-v{color:#34a36b;background:rgba(52,163,107,.10)}
.tag-r{color:#e0564a;background:rgba(224,86,74,.10)}
.tag-g{color:#a98a55;background:rgba(201,171,124,.16)}
.tabbar{height:84px;background:#fff;border-top:1px solid #eceae4;display:flex;padding:6px 8px 0;flex-shrink:0;position:relative;z-index:9;margin-top:auto}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:5px}
.tb .lb{font-size:10px;color:#9a9aa1}
.tb.on .lb{color:#4a5c8c;font-weight:600}
.tb.on svg{color:#4a5c8c}
.hi{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#1c1c1e;opacity:.9}
</style>
</head>
<body>
<div class="phone">

</body>
