<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>统考倒计时轮播卡 · 方案 C 暖金渐变卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:#26262a}
.phone{position:relative;width:390px;height:844px;background:#f5f4f1;overflow:hidden;display:flex;flex-direction:column}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:#1c1c1e;flex-shrink:0}
.status .t{font-size:15px;font-weight:600;letter-spacing:.3px}
.cap{padding:10px 20px 0;display:flex;align-items:baseline}
.cap .k{font-size:17px;font-weight:700;color:#1c1c1e;letter-spacing:.5px}
.cap .v{margin-left:auto;font-size:12px;font-weight:700;color:#a98a55;background:rgba(201,171,124,.16);border-radius:999px;padding:4px 12px}
.hint{padding:6px 20px 0;font-size:12px;color:#85858b;line-height:1.6}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 0 60px}
/* —— 方案 C 卡本体：暖金渐变，冲刺感 —— */
.cardC{margin:0 24px;background:linear-gradient(135deg,#dcc59a 0%,#c9ab7c 55%,#b99a63 100%);border-radius:16px;padding:20px 22px 18px;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(185,154,99,.35)}
.cardC .glow{position:absolute;right:-40px;top:-46px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.16)}
.cardC .glow2{position:absolute;left:-30px;bottom:-50px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.10)}
.cardC .flag{position:absolute;right:16px;top:16px;font-size:11px;font-weight:700;color:#7c5b0d;background:rgba(255,255,255,.72);border-radius:999px;padding:4px 11px;letter-spacing:1px}
.cardC .lab{font-size:12px;font-weight:600;color:#6b5322;letter-spacing:2px;position:relative;z-index:1}
.cardC .mid{display:flex;align-items:baseline;gap:10px;margin-top:14px;position:relative;z-index:1}
.cardC .n{font-size:80px;font-weight:900;color:#fff;line-height:.9;letter-spacing:-1px;text-shadow:0 2px 10px rgba(124,91,13,.28);font-family:'Songti SC','STSong','SimSun',serif}
.cardC .u{font-size:26px;font-weight:700;color:#fff;font-family:'Songti SC','STSong','SimSun',serif}
.cardC .e{margin-left:auto;text-align:right;font-size:13px;color:#4a3a15;font-weight:700;line-height:1.5}
.cardC .e small{display:block;font-size:11px;color:rgba(74,58,21,.72);font-weight:500;margin-top:3px}
.cardC .ft{margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.34);display:flex;justify-content:space-between;font-size:11px;color:#6b5322;position:relative;z-index:1}
.cardC .ft b{color:#4a3a15;font-weight:700}
.dots{display:flex;gap:6px;justify-content:center;margin-top:22px}
.dots i{width:6px;height:6px;border-radius:50%;background:#d8d5cd}
.dots i.on{background:#b99a63;width:16px;border-radius:3px}
</style>
</head>
<body>
<div class="phone">
  <div class="status">
    <span class="t">9:41</span>
    <svg width="64" height="12" viewBox="0 0 64 12" fill="#1c1c1e"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="1" width="3" height="11" rx="1"/><path d="M28 5.5a8.5 8.5 0 0 1 11 0l-1.6 1.9a6 6 0 0 0-7.8 0z"/><circle cx="33.5" cy="9.5" r="1.8"/><rect x="44" y="2" width="17" height="8" rx="2.5" fill="none" stroke="#1c1c1e" stroke-opacity=".5"/><rect x="46" y="4" width="11" height="4" rx="1"/><path d="M62 4.5v3a2 2 0 0 0 0-3z"/></svg>
  </div>

  <div class="cap"><span class="k">统考倒计时轮播卡 · 方案 C</span><span class="v">暖金渐变卡</span></div>
  <p class="hint">金渐变（#c9ab7c 系）卡面，白色大数字压金字，右上「冲刺」签——喜庆提气，冲刺阶段氛围最浓。</p>

  <div class="stage">
    <div class="cardC">
      <span class="glow"></span><span class="glow2"></span>
      <span class="flag">冲 刺</span>
      <div class="lab">统考倒计时 · 第 2 / 3 张 · 左右滑动</div>
      <div class="mid">
        <span class="n">41</span><span class="u">天</span>
        <span class="e">播音与主持类 · 省统考<small>笔试 2027.01.09（周六）09:00</small></span>
      </div>
      <div class="ft"><span>报名已确认</span><span><b>每周模考 1 次 · 已参加 4 次</b></span></div>
    </div>
    <div class="dots"><i></i><i class="on"></i><i></i></div>
  </div>
</div>
</body>
</html>
