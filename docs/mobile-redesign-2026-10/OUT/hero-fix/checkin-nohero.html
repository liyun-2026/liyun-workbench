<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>打卡 · 无题头（题头归位示意）</title>
<link rel="stylesheet" href="../../../preview-mobile-2026-10/assets/mobile.css">
<style>
  /* —— 题头归位示意：打卡页无题头，纸底直接开始 —— */
  .nohero-body{
    padding:0 16px calc(24px + env(safe-area-inset-bottom));
  }

  /* ---- 同心圆大盘（照 m-checkin.html）---- */
  .dial-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:26px 0 6px;
  }
  .dial{
    width:238px;
    height:238px;
    border-radius:50%;
    border:1px solid rgba(74,92,140,.28);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .disc{
    width:206px;
    height:206px;
    border-radius:50%;
    background:linear-gradient(165deg,#50618f,var(--blue-deep));
    box-shadow:0 12px 28px rgba(56,74,116,.35);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .iring{
    width:168px;
    height:168px;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,.35);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:7px;
    color:#fff;
  }
  .iring .word{
    font-family:var(--serif);
    font-size:25px;
    font-weight:600;
    letter-spacing:7px;
    text-indent:7px;
    line-height:1.2;
  }
  .iring .time{
    font-family:Georgia,var(--serif);
    font-size:19px;
    color:rgba(255,255,255,.92);
    letter-spacing:1.5px;
  }
  .status-line{
    margin-top:16px;
    font-size:11px;
    color:var(--ink-3);
    letter-spacing:.5px;
    text-align:center;
  }

  /* ---- 打卡方式按钮：扫码打卡 / 4 位密钥 ---- */
  .ck-btns{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .ckbtn{
    flex:1;
    height:44px;
    border-radius:22px;
    background:#fff;
    border:1px solid var(--line);
    color:var(--blue);
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    letter-spacing:1px;
  }

  /* ---- 断网补传提示（黄底细条，照 m-checkin.html）---- */
  .offline{
    display:flex;
    gap:9px;
    align-items:flex-start;
    background:rgba(201,171,124,.14);
    border:1px solid rgba(201,171,124,.42);
    border-radius:10px;
    padding:10px 12px;
    margin-top:20px;
    font-size:12px;
    line-height:1.6;
    color:#8a6d3f;
  }
  .offline svg{flex:none;margin-top:2px}
</style>
</head>
<body>

  <!-- 学生端整页水印（生产逻辑：仅学生端有） -->
  <div class="wm"></div>

  <!-- 无题头：纸底直接开始 -->
  <main class="nohero-body">

    <div class="sec" style="margin-top:18px">
      <h2>今日打卡</h2>
      <span class="pill gold">未打卡</span>
    </div>

    <!-- 同心圆大盘 · 未打卡态 -->
    <div class="dial-wrap">
      <div class="dial">
        <div class="disc">
          <div class="iring">
            <div class="word">打卡</div>
            <div class="time">10:15:00</div>
          </div>
        </div>
      </div>
      <div class="status-line">进入打卡窗口 · 点击圆盘即打卡（服务端时间）</div>
    </div>

    <!-- 打卡方式 -->
    <div class="ck-btns">
      <span class="ckbtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M7 12h10"/></svg>
        扫码打卡
      </span>
      <span class="ckbtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H20M17 12v3M20 12v2.2"/></svg>
        4 位密钥
      </span>
    </div>

    <!-- 断网补传提示 -->
    <div class="offline">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a7 7 0 017 7M12 5a7 7 0 00-7 7M12 8.5a3.5 3.5 0 013.5 3.5M12 8.5A3.5 3.5 0 008.5 12M12 12v.01"/><path d="M4 20L20 4" stroke-width="1.4"/></svg>
      <span>有 1 次打卡没传上去（断网时记的），联网后自动提交，按当时时间算迟到。</span>
    </div>

  </main>

  <!-- 底部 5-Tab（学生端 · 打卡 active） -->
  <nav class="tabbar">
    <a href="#">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></svg></span>
      今日
    </a>
    <a class="on" href="#">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.2-6.5-10a6.5 6.5 0 0113 0c0 4.8-6.5 10-6.5 10z"/><circle cx="12" cy="10.5" r="2.2"/></svg></span>
      打卡
    </a>
    <a href="#">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h6"/></svg></span>
      作业
    </a>
    <a href="#">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></span>
      课表
    </a>
    <a href="#">
      <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.8 3.6-6.5 8-6.5s8 2.7 8 6.5"/></svg></span>
      我的
    </a>
  </nav>

</body>
</html>
