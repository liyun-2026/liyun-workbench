<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>砺蕴上手卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#e8e6e1}
.page{width:595px;height:842px;overflow:hidden;position:relative;margin:0 auto}

body{padding:0}
.wrap{width:1508px;height:831px;overflow:hidden;background:#eceae5;padding:34px 34px 0;font-family:'PingFang SC','Helvetica Neue',sans-serif}
h1{font-family:'Songti SC','STSong','Source Han Serif SC','Noto Serif CJK SC',serif;font-size:26px;color:#2a2a2a;letter-spacing:.1em;white-space:nowrap;margin:2px 0 6px}
.tip{font-size:13px;color:#8d877b;margin-bottom:22px}
.row{display:flex;gap:22px;align-items:flex-start}
.cell{position:relative;width:480px}
.cell img{width:480px;display:block;box-shadow:0 4px 18px rgba(0,0,0,.14)}
.tag{position:absolute;top:10px;left:10px;background:rgba(24,33,30,.82);color:#f3eedd;
  font-size:13px;letter-spacing:.08em;padding:6px 13px;border-radius:999px;white-space:nowrap}

</style></head><body><div class="wrap">
  <h1>老师上手卡 · 三方案对照</h1>
  <div class="tip">A5 竖版 148×210mm 设计稿 · 挑中哪款告诉主理人编号即可</div>
  <div class="row">
    <div class="cell"><span class="tag">方案 A 素笺极简</span><img src="老师-A.png" alt=""></div>
    <div class="cell"><span class="tag">方案 B 暖金册页</span><img src="老师-B.png" alt=""></div>
    <div class="cell"><span class="tag">方案 C 深色速览</span><img src="老师-C.png" alt=""></div>
  </div>
</div></body></html>
