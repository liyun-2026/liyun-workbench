<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>款式 1 · 签到立牌 · 预览</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --paper:#f7f5f0; --ink:#2b3446; --ink-2:#5a6478; --ink-3:#98a0b0;
    --navy:#243049; --gold:#c9ab7c; --gold-deep:#a98d5f; --gold-line:rgba(169,141,95,.35);
    --c-ochre:#c07a52; --c-azure:#5f7cae; --c-miss:#b05550;
    --serif:'Noto Serif SC','Songti SC','STSong',serif;
  }
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:
      radial-gradient(1200px 700px at 18% -10%, rgba(201,171,124,.10), transparent 60%),
      radial-gradient(1100px 650px at 92% 110%, rgba(36,48,73,.06), transparent 55%),
      linear-gradient(180deg,#f8f6f1 0%,#f5f2ea 100%);
    color:var(--ink);font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    display:flex;flex-direction:column;padding:0 72px}
  /* ── 顶部窄横带 ── */
  .top{height:100px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--gold-line)}
  .brand{display:flex;align-items:center;gap:24px}
  .badge{width:58px;height:58px;border-radius:11px;background:linear-gradient(160deg,#243049,#2c3a5c);
    border:1px solid rgba(201,171,124,.55);box-shadow:0 8px 22px rgba(36,48,73,.28);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:24px;letter-spacing:2px;color:#f3efe6;text-indent:2px}
  .bn .c1{font-family:var(--serif);font-size:29px;font-weight:600;letter-spacing:7px;color:var(--navy)}
  .bn .c2{margin-top:5px;font-size:11px;letter-spacing:4px;color:var(--ink-3)}
  .tright{display:flex;align-items:center;gap:36px}
  .clock{font-family:var(--serif);font-weight:600;font-variant-numeric:tabular-nums;
    font-size:58px;line-height:1;letter-spacing:2px;color:var(--navy)}
  .tmeta{text-align:right}
  .tmeta .d1{font-size:18px;letter-spacing:2.5px;color:var(--ink-2)}
  .tmeta .d2{margin-top:6px;font-size:13.5px;letter-spacing:2px;color:var(--gold-deep)}
  /* ── 中央海报卡 ── */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  .poster{width:920px;max-height:100%;display:flex;flex-direction:column;align-items:center;
    background:#fff;border-radius:28px;border:1px solid rgba(36,48,73,.08);
    box-shadow:0 30px 80px rgba(36,48,73,.14), 0 4px 14px rgba(36,48,73,.06);
    padding:38px 60px 34px;gap:20px}
  .lab{display:flex;align-items:center;gap:16px;font-size:16px;letter-spacing:5px;color:var(--ink-2)}
  .lab::before,.lab::after{content:"";width:56px;height:1px;background:var(--gold-line)}
  .qr{width:420px;height:420px}
  .qr svg{width:100%;height:100%;display:block}
  .code{font-family:var(--serif);font-weight:600;font-size:96px;line-height:1;letter-spacing:16px;
    text-indent:16px;color:var(--navy);font-variant-numeric:tabular-nums}
  .timer{width:420px}
  .bar-track{height:7px;border-radius:4px;background:rgba(169,141,95,.18);overflow:hidden}
  .bar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold-deep));
    transition:width 1s linear}
  .cd{margin-top:11px;text-align:center;font-size:14px;letter-spacing:2.5px;color:var(--ink-3)}
  .cd b{color:var(--gold-deep);font-weight:600;font-variant-numeric:tabular-nums;font-size:16.5px}
  /* ── 考勤明细带（金线之上：五数 + 未到/请假名单，==细化==）── */
  .detail{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:11px;
    padding:22px 0 18px}
  .nums5{display:flex;align-items:flex-start;gap:64px}
  .nums5 .a{text-align:center}
  .nums5 .a b{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1;
    color:var(--navy);font-variant-numeric:tabular-nums;display:block}
  .nums5 .a span{display:block;margin-top:8px;font-size:12.5px;letter-spacing:3px;color:var(--ink-2)}
  .nums5 .a.gd b{color:var(--gold-deep)}
  .nums5 .a.lt b{color:var(--c-ochre)}
  .nums5 .a.lv b{color:var(--c-azure)}
  .nums5 .a.ms b{color:var(--c-miss)}
  .names{font-size:14px;letter-spacing:2px;color:var(--ink-2)}
  .names .k{color:var(--ink-3);margin-right:6px}
  .names .who{color:var(--c-miss)}
  .names .sep{margin:0 18px;color:var(--gold-line)}
  /* ── 底部金线带（校训 + 班级落款）── */
  .bot{flex:0 0 auto;height:96px;display:flex;align-items:center;justify-content:space-between;
    border-top:2px solid var(--gold)}
  .motto{font-family:var(--serif);font-size:24px;letter-spacing:9px;color:var(--navy)}
  .motto small{display:block;margin-top:6px;font-family:-apple-system;font-size:10.5px;
    letter-spacing:4px;color:var(--ink-3)}
  .cls{font-size:14px;letter-spacing:3px;color:var(--ink-3)}
  /* ── hover 右下角浮出（沿用 5.23 基建示意）── */
  .fab{position:fixed;right:34px;bottom:30px;display:flex;gap:12px;opacity:0;transform:translateY(8px);
    transition:.25s;pointer-events:none}
  body:hover .fab{opacity:1;transform:none;pointer-events:auto}
  .fab button{padding:11px 22px;border-radius:999px;border:1px solid var(--gold-line);
    background:rgba(255,255,255,.9);color:var(--ink-2);font-size:13.5px;letter-spacing:2px;
    cursor:pointer;box-shadow:0 6px 18px rgba(36,48,73,.12)}
  .fab button:hover{border-color:var(--gold);color:var(--navy)}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <div class="badge">博艺</div>
      <div class="bn"><div class="c1">砺蕴工作系统</div><div class="c2">BOYI EDUCATION · ACADEMIC ADMINISTRATION</div></div>

      <div class="code">486205</div>
      <div class="timer">
        <div class="bar-track"><div class="bar" id="bar" style="width:88%"></div></div>
        <div class="cd"><b id="cdown">53</b> 秒后换码 · 学员扫面前屏幕即可签到</div>
      </div>
    </div>
  </div>
  <div class="detail">
    <div class="nums5">
      <div class="a"><b>10</b><span>应到</span></div>
      <div class="a gd"><b>9</b><span>实到</span></div>
      <div class="a lt"><b>1</b><span>迟到</span></div>

  <div class="fab"><button>调布局</button><button>退出</button></div>
<script>
  var p=function(n){return String(n).padStart(2,'0')};
  var W=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  function tick(){
    var d=new Date();
    var set=function(id,t){var e=document.getElementById(id);if(e&&e.textContent!==t)e.textContent=t};
    set('ck',p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()));
    set('ck0',p(d.getHours())+':'+p(d.getMinutes()));
    set('cksec',':'+p(d.getSeconds()));
    set('dt',d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · '+W[d.getDay()]);
  }
  setInterval(tick,1000);tick();
  var left=53;
  setInterval(function(){
    left=left>0?left-1:60;
    var b=document.getElementById('bar'),c=document.getElementById('cdown');
    if(b)b.style.width=(left/60*100)+'%';
    if(c)c.textContent=left;
  },1000);
</script>
