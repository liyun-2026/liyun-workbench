<!DOCTYPE html>
<!-- 方案 D · 品牌海报版 —— 整屏像一张会动的海报：左侧竖排校训衬线金 + 蓝徽，右侧金框白卡打卡码 + 大时钟，底部日期条。品牌感最强。预览稿，未上线。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案 D · 品牌海报版 · 看板重设计预览</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --navy-1:#243049; --navy-2:#2c3a5c; --navy-deep:#1a2236;
    --gold:#c9ab7c; --gold-lite:#e8cf9e; --gold-dim:rgba(201,171,124,.22);
    --paper:#f3efe6; --paper-2:rgba(243,239,230,.58); --paper-3:rgba(243,239,230,.38);
    --ink:#2b3446;
    --serif:'Noto Serif SC','Songti SC','STSong',serif;
  }
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:linear-gradient(160deg,var(--navy-1) 0%,var(--navy-2) 78%,#33415f 100%);
    color:var(--paper);font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    display:flex;flex-direction:column}
  .main{flex:1;display:flex;min-height:0}
  /* ── 左：竖排校训海报区 ── */
  .poster{flex:0 0 40%;position:relative;display:flex;align-items:center;justify-content:center;
    border-right:1px solid rgba(201,171,124,.30)}
  .poster .vtext{writing-mode:vertical-rl;font-family:var(--serif);font-weight:600;
    font-size:74px;letter-spacing:30px;color:var(--gold-lite);line-height:1.28;
    text-shadow:0 2px 26px rgba(10,15,28,.4)}
  .poster .vtext i{font-style:normal;color:var(--paper-2);font-size:40px}
  .poster .seal{position:absolute;left:96px;bottom:88px;display:flex;flex-direction:column;align-items:center;gap:16px}
  .poster .seal img{width:132px;height:132px;display:block;filter:drop-shadow(0 10px 28px rgba(10,15,28,.45))}
  .poster .seal span{font-size:12px;letter-spacing:6px;text-indent:6px;color:var(--paper-3)}
  /* 竖排旁的细金线装饰 */
  .poster::after{content:"";position:absolute;right:64px;top:96px;bottom:96px;width:1px;
    background:linear-gradient(180deg,transparent,rgba(201,171,124,.5) 18%,rgba(201,171,124,.5) 82%,transparent)}
  /* ── 右：打卡区 ── */
  .signin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 90px}
  .clock{font-family:var(--serif);font-weight:600;font-variant-numeric:tabular-nums;
    font-size:112px;line-height:1;letter-spacing:4px}
  .clock .sec{font-size:48px;color:var(--gold-lite)}
  .dateline{margin-top:16px;font-size:22px;letter-spacing:4px;color:var(--paper-2)}
  .dateline em{font-style:normal;color:var(--gold-lite)}
  /* 金框白卡：外金线 + 内衬细线，双框匾额做法 */
  .frame{margin-top:40px;padding:9px;border:1px solid rgba(201,171,124,.75);border-radius:6px;
    box-shadow:0 22px 60px rgba(10,15,28,.42)}
  .frame .inner{background:#fff;border-radius:4px;padding:8px;border:1px solid rgba(201,171,124,.35)}
  .card{padding:30px 62px 28px;display:flex;flex-direction:column;align-items:center}
  .card .lab{font-size:14px;letter-spacing:6px;text-indent:6px;color:#6b7284}
  .qr{width:296px;height:296px;margin-top:18px}
  .qr svg{width:100%;height:100%;display:block}
  .code{margin-top:16px;font-family:var(--serif);font-weight:600;font-size:64px;line-height:1;
    color:var(--ink);letter-spacing:16px;text-indent:16px;font-variant-numeric:tabular-nums}
  .timer{margin-top:18px;width:280px}
  .timer .bar-track{height:3px;background:var(--gold-dim);overflow:hidden}
  .timer .bar{height:100%;background:var(--gold);transition:width 1s linear}
  .timer .cd{margin-top:8px;text-align:center;font-size:13px;letter-spacing:2px;color:#8a93a6}
  .timer .cd b{color:#a8895a;font-variant-numeric:tabular-nums}
  /* ── 底部日期条 ── */
  .foot{flex:0 0 62px;background:rgba(26,34,54,.62);border-top:1px solid rgba(201,171,124,.35);
    display:flex;align-items:center;justify-content:space-between;padding:0 44px}
  .foot .l{display:flex;align-items:center;gap:12px;font-size:15px;letter-spacing:3px;color:var(--paper-2)}
  .foot .l::before{content:"";width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
  .foot .r{font-size:16px;letter-spacing:3px;color:var(--paper-2);font-variant-numeric:tabular-nums}
  .foot .r em{font-style:normal;color:var(--gold-lite)}
</style>
</head>

        <div class="timer">
          <div class="bar-track"><div class="bar" id="bar" style="width:78%"></div></div>
          <div class="cd"><b id="cdown">47</b> 秒后换码</div>
        </div>
      </div></div></div>
    </div>
  </div>
  <div class="foot">
    <div class="l">博艺教育 · 砺蕴教务系统</div>
    <div class="r"><span id="dt">2026年10月30日 · 星期五</span> · <em>数据实时同步</em></div>
  </div>
<script>
  const p = n => String(n).padStart(2,'0');
  function tick(){
    const d = new Date();
    const set = (id,t) => { const e = document.getElementById(id); if (e && e.textContent !== t) e.textContent = t; };
    set('ck', p(d.getHours()) + ':' + p(d.getMinutes()));
    set('cs', p(d.getSeconds()));
    const w = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
    set('dt', d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 · ' + w);
  }
  setInterval(tick, 1000); tick();
  let left = 47;
  setInterval(() => {
    left = left > 0 ? left - 1 : 60;
    document.getElementById('bar').style.width = (left / 60 * 100) + '%';
    document.getElementById('cdown').textContent = left;
  }, 1000);
</script>
