<!DOCTYPE html>
<!-- 方案 A · 签到专注版 —— 整屏只为一件事：让学生 3 米外扫上码。
     深蓝渐变 + 衬线大时钟 + 白色大卡超大码 + 底部校训金线。预览稿，未上线。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案 A · 签到专注版 · 看板重设计预览</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --navy-1:#243049; --navy-2:#2c3a5c; --navy-deep:#1a2236;
    --gold:#c9ab7c; --gold-lite:#e8cf9e; --gold-dim:rgba(201,171,124,.22);
    --paper:#f3efe6; --paper-2:rgba(243,239,230,.58); --paper-3:rgba(243,239,230,.38);
    --ink:#2b3446;
    --serif:'Noto Serif SC','Songti SC','STSong',serif;
  }
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{
    background:linear-gradient(180deg,var(--navy-1) 0%,var(--navy-2) 100%);
    color:var(--paper);font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    display:flex;flex-direction:column;
  }
  /* ── 顶部条 ── */
  .top{display:flex;align-items:center;justify-content:space-between;padding:30px 44px 0}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{width:44px;height:44px;display:block}
  .brand b{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:5px;color:var(--paper)}
  .fresh{font-size:14px;letter-spacing:2px;color:var(--paper-3)}
  /* ── 主构图 ── */
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:-12px}
  .clock{font-family:var(--serif);font-weight:600;font-variant-numeric:tabular-nums;
    font-size:150px;line-height:1;color:var(--paper);letter-spacing:6px;text-indent:6px}
  .clock .sec{font-size:64px;color:var(--gold-lite);letter-spacing:0;text-indent:0}
  .dateline{margin-top:20px;font-size:25px;letter-spacing:4px;color:var(--paper-2)}
  .dateline em{font-style:normal;color:var(--gold-lite)}
  /* 白色大卡 */
  .card{margin-top:42px;background:#fff;border-radius:24px;padding:40px 64px 36px;
    box-shadow:0 24px 70px rgba(10,15,28,.45);display:flex;flex-direction:column;align-items:center}
  .card .lab{font-size:15px;letter-spacing:7px;text-indent:7px;color:var(--ink-2,#6b7284);color:#6b7284}
  .qr{width:352px;height:352px;margin-top:22px}
  .qr svg{width:100%;height:100%;display:block}
  .code{margin-top:20px;font-family:var(--serif);font-weight:600;font-size:86px;line-height:1;
    color:var(--ink);letter-spacing:22px;text-indent:22px;font-variant-numeric:tabular-nums}
  .timer{margin-top:24px;width:330px}
  .timer .bar-track{height:3px;background:var(--gold-dim);border-radius:2px;overflow:hidden}
  .timer .bar{height:100%;background:var(--gold);border-radius:2px;transition:width 1s linear}
  .timer .cd{margin-top:10px;text-align:center;font-size:14px;letter-spacing:3px;color:#8a93a6}
  .timer .cd b{font-size:15px;color:#a8895a;font-variant-numeric:tabular-nums}
  /* ── 底部校训 ── */
  .foot{padding:0 0 40px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .foot .rule{width:64px;height:2px;background:var(--gold)}
  .foot .motto{font-family:var(--serif);font-size:20px;letter-spacing:9px;text-indent:9px;color:var(--paper-2)}
  .foot .eng{font-size:11px;letter-spacing:4px;color:var(--paper-3)}
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><img src="../../assets/seal-boyi.png" alt=""><b>砺蕴教务系统</b></div>

      <div class="timer">
        <div class="bar-track"><div class="bar" id="bar" style="width:78%"></div></div>
        <div class="cd"><b id="cdown">47</b> 秒后换码</div>
      </div>
    </div>
  </div>
  <div class="foot">
    <div class="rule"></div>
    <div class="motto">博学宏才 · 艺德卓绝</div>
    <div class="eng">BOYI EDUCATION · ERUDITART EAS</div>

<script>
  const p = n => String(n).padStart(2,'0');
  function tick(){
    const d = new Date();
    const set = (id,t) => { const e = document.getElementById(id); if (e && e.textContent !== t) e.textContent = t; };
    set('ck', p(d.getHours()) + ':' + p(d.getMinutes()));
    set('cs', p(d.getSeconds()));
    set('fs', p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()));
  }
  setInterval(tick, 1000); tick();
  /* 换码倒计时演示：60 秒循环（生产为服务端派生 60s 动态码） */
  let left = 47;
  setInterval(() => {
    left = left > 0 ? left - 1 : 60;
    document.getElementById('bar').style.width = (left / 60 * 100) + '%';
    document.getElementById('cdown').textContent = left;
  }, 1000);
</script>

</html>
